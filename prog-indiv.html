<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14233c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prog Indiv">
<meta name="robots" content="noindex, nofollow">
<title>EASTBOX · PROG INDIV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   EASTBOX — PROG INDIV
   Suivi des athlètes en programme individualisé. Fichier séparé d'index.html
   et de tv.html (même principe : un seul fichier, aucune dépendance
   externe hormis les polices Google déjà utilisées ailleurs) — un login
   cassé ou une évolution ici ne doit jamais affecter les coachs ni l'écran
   TV. Étape 1 (2026-08-26) : connexion + coquille à 3 onglets. La saisie
   réelle (suivi du jour, nutrition) sera ajoutée dans une itération
   suivante — elle demandera une vraie sauvegarde côté serveur, pas encore
   construite.
   =========================================================================== */
:root{
  --navy:#14233c; --navy-2:#1b2e4d; --navy-3:#24395e;
  --orange:#ea8d49; --orange-d:#c9752f;
  --ink:#eef2f8; --muted:#8ea0bd; --line:rgba(255,255,255,.09);
  --r:14px; --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--navy); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55;
  min-height:100dvh; overscroll-behavior-y:none;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{margin:0;font-weight:700}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;font-size:16px}
.hide{display:none !important}

/* ---------- Barre du haut ---------- */
header{
  position:sticky; top:0; z-index:50;
  background:rgba(20,35,60,.93); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px;
}
.brand-logo{height:34px;width:auto;display:block}
.header-date{
  text-align:center; font-family:'JetBrains Mono',monospace; font-size:11px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.header-right{display:flex; align-items:center; gap:12px}
.who{font-size:12px;color:var(--muted);text-align:right;line-height:1.25}
.who b{color:var(--ink);display:block;font-size:13px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;background:var(--navy-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:16px;
  transition:background .15s;
}
.icon-btn:active{background:var(--navy-3)}
main{padding:var(--pad);max-width:640px;margin:0 auto}

/* ---------- Écran connexion (même style qu'index.html/tv.html) ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card-login{
  width:100%;max-width:380px;background:var(--navy-2);
  border:1px solid var(--line);border-radius:20px;padding:30px 24px;
  box-shadow:0 22px 60px rgba(0,0,0,.42);
}
.logo{display:flex;justify-content:center}
.logo img{width:100%;max-width:240px;height:auto;display:block}
.logo-sub{
  text-align:center;color:var(--muted);font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;margin:8px 0 26px;
}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 7px;font-weight:600}
.field{margin-bottom:16px}
input[type=text],input[type=password]{
  width:100%;padding:13px 14px;border-radius:11px;
  background:var(--navy);border:1.5px solid var(--line);color:var(--ink);
  outline:none;transition:border-color .15s;
}
input:focus{border-color:var(--orange)}
.btn{
  width:100%;padding:14px;border-radius:11px;
  background:var(--orange);color:#10192b;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;font-size:13px;
  transition:transform .1s,background .15s;
}
.btn:active{transform:scale(.98);background:var(--orange-d)}
.btn[disabled]{opacity:.55;pointer-events:none}
.msg{
  margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13px;
  background:rgba(224,102,102,.12);border:1px solid rgba(224,102,102,.3);color:#f4b4b4;
}

/* ---------- Onglets ---------- */
.tabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{
  flex:0 0 auto;padding:10px 16px;border-radius:999px;
  background:var(--navy-2);border:1px solid var(--line);
  font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--muted);white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.tab-btn.on{background:var(--orange);color:#10192b;border-color:var(--orange)}

/* ---------- États vides (placeholder, chargement) ---------- */
.empty{text-align:center;color:var(--muted);padding:52px 20px;font-size:14px}
.empty .big{font-size:38px;margin-bottom:12px;opacity:.5}
.empty p{max-width:360px;margin:0 auto;line-height:1.6}
.spin{
  width:26px;height:26px;margin:44px auto;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--orange);
  animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Suivi Quotidien ---------- */
.ci-section{margin-bottom:26px}
.ci-section-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.02em;color:var(--orange)}
.ci-section-sub{font-size:13px;font-weight:700;color:var(--ink);margin-top:2px}
.ci-section-desc{font-size:12px;color:var(--muted);margin:4px 0 14px;line-height:1.5}
.ci-card{background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.ci-label{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.ci-opt{font-weight:400;color:var(--muted);font-size:11px}
.ci-input,.ci-textarea{
  width:100%;padding:11px 12px;border-radius:10px;
  background:var(--navy);border:1.5px solid var(--line);color:var(--ink);
  outline:none;font-size:14px;transition:border-color .15s;
}
.ci-input:focus,.ci-textarea:focus{border-color:var(--orange)}
.ci-textarea{min-height:80px;resize:vertical;font-family:inherit}
.ci-pills{display:flex;flex-wrap:wrap;gap:8px}
.ci-pill{
  padding:9px 14px;border-radius:999px;background:var(--navy);border:1.5px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--muted);transition:background .15s,color .15s,border-color .15s;
}
.ci-pill.on{background:var(--orange);color:#10192b;border-color:var(--orange)}
.ci-pill.ci-multi{
  flex-direction:column;align-items:flex-start;text-align:left;gap:1px;
  flex:1 1 150px;padding:10px 14px;
}
.ci-pill.ci-multi b{font-size:12px;display:block}
.ci-pill.ci-multi span{font-size:11px;font-weight:500;opacity:.8}
.ci-hydra{display:flex;align-items:center;gap:14px}
.ci-hydra-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--ink);min-width:64px;text-align:center}
.ci-hydra-btn{
  width:44px;height:44px;border-radius:12px;background:var(--navy);border:1.5px solid var(--line);
  font-size:16px;font-weight:800;color:var(--ink);flex:0 0 auto;
}
.ci-hydra-btn.on{background:var(--orange);color:#10192b;border-color:var(--orange);width:auto;padding:0 14px;font-size:13px}
.ci-submit{
  width:100%;padding:16px;border-radius:14px;margin:8px 0 40px;
  background:#25D366;color:#0b3d1f;font-weight:800;font-size:14px;
  letter-spacing:.03em;text-transform:uppercase;
  box-shadow:0 10px 30px rgba(37,211,102,.25);
  transition:transform .1s;
}
.ci-submit:active{transform:scale(.98)}
.ci-banner{
  background:rgba(234,141,73,.12);border:1px solid var(--orange);border-radius:12px;
  padding:12px 14px;margin-bottom:18px;text-align:center;font-size:12px;
  color:var(--orange);font-weight:700;letter-spacing:.02em;
}

/* ---------- Widgets repris du tracker fusionné (compte/emoji/segmented/slider) ---------- */
.ci-counter{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--navy);border:1.5px solid var(--line);border-radius:12px;padding:14px}
.ci-counter-btn{width:40px;height:40px;border-radius:10px;background:var(--navy-3);border:1px solid var(--line);font-size:18px;font-weight:800;color:var(--ink);display:grid;place-items:center}
.ci-counter-btn:active{transform:scale(.94)}
.ci-counter-val{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--ink);min-width:70px;text-align:center}

.ci-emoji-group{display:grid;gap:8px}
.ci-emoji-group.cols-4{grid-template-columns:repeat(4,1fr)}
.ci-emoji-group.cols-3{grid-template-columns:repeat(3,1fr)}
.ci-emoji-btn{background:var(--navy);border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;transition:all .15s}
.ci-emoji-btn.on{border-color:var(--orange);background:rgba(234,141,73,.12)}
.ci-emoji-btn .e{font-size:22px;display:block;margin-bottom:4px}
.ci-emoji-btn .l{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.ci-emoji-btn.on .l{color:var(--orange)}
.ci-emoji-btn:active{transform:scale(.96)}

.ci-segmented{background:var(--navy);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.ci-segmented-val{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--ink);margin-bottom:8px}
.ci-segmented-val span{color:var(--muted);font-size:13px;margin-left:2px}
.ci-segmented-bars{display:flex;gap:6px}
.ci-segmented-bar{flex:1;height:14px;background:var(--navy-3);border:1px solid var(--line);border-radius:4px;cursor:pointer;transition:all .1s}
.ci-segmented-bar.on{background:var(--orange);border-color:var(--orange)}
.ci-segmented-bar:active{transform:scale(.95)}

.ci-slider-wrap{background:var(--navy);border:1.5px solid var(--line);border-radius:12px;padding:16px 14px 10px}
.ci-slider-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ci-slider-val{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;color:var(--ink)}
.ci-slider-val span{font-size:13px;color:var(--muted);margin-left:2px}
.ci-slider-track{position:relative;height:6px;background:var(--navy-3);border-radius:3px;margin:0 6px}
.ci-slider-fill{position:absolute;left:0;top:0;height:100%;background:var(--orange);border-radius:3px}
input[type=range].ci-slider-input{
  position:absolute;top:-10px;left:-6px;right:-6px;width:calc(100% + 12px);height:26px;
  -webkit-appearance:none;appearance:none;background:transparent;outline:none;margin:0;padding:0;
}
input[type=range].ci-slider-input::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--orange);cursor:pointer;border:3px solid var(--navy);box-shadow:0 2px 8px rgba(234,141,73,.5);
}
input[type=range].ci-slider-input::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;
  background:var(--orange);cursor:pointer;border:3px solid var(--navy);box-shadow:0 2px 8px rgba(234,141,73,.5);
}

.ci-conditional{display:none;margin-top:0}
.ci-conditional.on{display:block;animation:ciFadeIn .2s ease-out}
@keyframes ciFadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

.ci-toast{
  position:fixed;bottom:24px;left:16px;right:16px;max-width:540px;margin:0 auto;
  background:var(--navy-2);border:1px solid var(--orange);color:var(--ink);
  padding:14px 16px;border-radius:12px;font-size:13px;text-align:center;z-index:200;
  transform:translateY(20px);opacity:0;pointer-events:none;transition:all .2s;font-weight:600;
}
.ci-toast.show{transform:translateY(0);opacity:1}
.ci-toast.error{border-color:#e06666}

/* ---------- Programme d'entraînement (plan hebdo + logging séance) ---------- */
.plan-week-nav{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin-bottom:12px;
}
.plan-week-nav-btn{width:36px;height:36px;background:var(--navy-3);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:16px;display:flex;align-items:center;justify-content:center}
.plan-week-label{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;text-align:center;color:var(--ink)}
.plan-week-today{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--orange);text-align:center;margin-top:2px;text-decoration:underline}
.plan-history-link{text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:16px;text-decoration:underline;text-underline-offset:3px}
.plan-history-back{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--orange);margin-bottom:14px;text-decoration:underline}
.week{background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.week-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 15px;text-align:left}
.week-num{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;min-width:52px;color:var(--orange)}
.week-meta{flex:1;min-width:0}
.week-meta .t{display:block;font-weight:600;font-size:14px;color:var(--ink)}
.week.current{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.chev{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;background:var(--orange);color:#10192b}
.days{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--navy-2);border:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.day.on{background:var(--orange);color:#10192b;border-color:var(--orange)}
.doc{background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px}
.doc h1,.doc h2{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.02em;color:var(--orange);line-height:1.12;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.doc h1{font-size:29px}.doc h2{font-size:24px}
.doc h3{font-size:14px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink);margin:22px 0 9px}
.doc h4{font-size:13px;color:var(--muted);margin:16px 0 7px;letter-spacing:.06em;text-transform:uppercase}
.doc>:first-child{margin-top:0}
.doc p{margin:0 0 11px;color:var(--ink)}
.doc ul,.doc ol{margin:0 0 13px;padding-left:21px}
.doc li{margin-bottom:5px;color:var(--ink)}
.doc li::marker{color:var(--orange)}
.doc strong{color:#fff}
.doc em{color:var(--muted);font-style:italic}
.doc hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.doc blockquote{margin:0 0 13px;padding:10px 14px;border-left:3px solid var(--orange);background:rgba(234,141,73,.08);border-radius:0 9px 9px 0;color:#f0d9c3}
.doc code{font-family:'JetBrains Mono',monospace;font-size:.87em;background:var(--navy);padding:2px 6px;border-radius:5px;color:var(--orange)}
.doc pre{background:var(--navy);border:1px solid var(--line);border-radius:10px;padding:13px;overflow-x:auto;margin:0 0 13px}
.doc pre code{background:none;padding:0;color:var(--ink)}
.doc a{color:var(--orange)}
.doc img{max-width:100%;border-radius:10px}
.plan-doc-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;color:var(--ink);margin-bottom:12px}
.plan-log{background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.plan-log-video{display:flex;align-items:center;gap:8px;background:var(--navy);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 10px;font-size:12px;color:var(--muted)}
.plan-log-video input{display:none}
.plan-log-submit{width:100%;background:var(--orange);color:#10192b;border:none;padding:12px;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.2px;font-weight:700;text-transform:uppercase;transition:transform .1s,background .15s}
.plan-log-submit:active{transform:scale(.98);background:var(--orange-d)}
.plan-log-submit:disabled{opacity:.55;pointer-events:none}
.plan-video-hint{font-size:10.5px;color:var(--muted);margin:-4px 0 10px 2px;font-style:italic}
.plan-log-badge{
  background:rgba(234,141,73,.12);border:1px solid var(--orange);border-radius:9px;
  padding:8px 11px;margin-bottom:10px;font-size:11px;color:var(--orange);font-weight:700;
}

@media(min-width:640px){ :root{--pad:22px} }
</style>
</head>
<body>

<!-- ============================ CONNEXION ============================ -->

<script>
/* ===========================================================================
   CONFIGURATION — même déploiement Apps Script qu'index.html/tv.html (une
   nouvelle action 'indivLogin' y a été ajoutée, espace INDIV_USERS séparé
   des coachs). Ne pas changer sans changer les 3 fichiers.
   =========================================================================== */
const API = 'https://script.google.com/macros/s/AKfycbyiug_GyeZa-lgbbIB7TQZ_3_p8pIpRwxF0ICYuWUXQ5NbKcj6pH3dMsVBspScEYB9pMg/exec';

const S = { token:null, user:null, tab:'quotidien' };
const $  = s => document.querySelector(s);

async function api(payload){
  const r = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload),
    redirect:'follow'
  });
  if(!r.ok) throw new Error('Serveur injoignable ('+r.status+')');
  return await r.json();
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), msg = $('#loginMsg');
  btn.disabled = true; btn.textContent = 'Connexion…'; msg.classList.add('hide');
  try{
    const res = await api({ action:'indivLogin', login:$('#u').value, pass:$('#p').value });
    if(!res.ok) throw new Error(res.error || 'Échec de la connexion');
    S.token = res.token; S.user = res.user;
    try{ localStorage.setItem('eb_indiv', JSON.stringify({t:res.token,u:res.user})); }catch(_){}
    $('#p').value = '';
    start();
  }catch(err){
    msg.textContent = err.message; msg.classList.remove('hide');
  }finally{
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
});

$('#logoutBtn').addEventListener('click', () => logout());

function logout(note){
  try{ localStorage.removeItem('eb_indiv'); }catch(_){}
  S.token = S.user = null;
  $('#app').classList.add('hide');
  $('#login').classList.remove('hide');
  if(note){ const m = $('#loginMsg'); m.textContent = note; m.classList.remove('hide'); }
}

function restore(){
  try{
    const raw = localStorage.getItem('eb_indiv');
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s.t || !s.u) return false;
    S.token = s.t; S.user = s.u;
    return true;
  }catch(_){ return false; }
}

function headerDateStr(){
  const s = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

async function start(){
  $('#login').classList.add('hide');
  $('#app').classList.remove('hide');
  $('#whoName').textContent = S.user.name;
  $('#headerDate').textContent = headerDateStr();
  await checkTodayBilan();
  showTab('quotidien');
}

/** Relit le dernier bilan envoyé aujourd'hui (s'il existe) pour pré-remplir
 *  le formulaire et passer le bouton en "Modifier mon bilan" — même
 *  principe que checkTodaySubmission() du tracker fusionné. */
async function checkTodayBilan(){
  try{
    const res = await api({ action:'indivBilanToday', token:S.token });
    if(res.ok && res.found){
      Object.assign(ci, res.data);
      ['reveil','stress','duration','rpe','energieSoir','rpeCognitif','hydraL'].forEach(k => {
        if(ci[k] !== '' && ci[k] != null) ci[k] = Number(ci[k]);
      });
      if(!Array.isArray(ci.activites)) ci.activites = [];
      const d = new Date(res.horodatage);
      S.bilanTodaySubmittedAt = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      S.isUpdate = true;
    }
  }catch(err){ console.warn('checkTodayBilan failed:', err); }
}

/* ===========================================================================
   ONGLETS — « Suivi Quotidien » et « Programme d'entraînement » sont de
   vrais écrans (voir plus bas). « Suivi Nutrition » reste une coquille pour
   l'instant : état « à venir » explicite plutôt qu'un formulaire à moitié
   fait, en attendant la prochaine itération.
   =========================================================================== */
const TABS = {
  nutrition: {
    icon: '🍽️',
    title: 'Suivi Nutrition',
    text: 'Ici tu pourras bientôt enregistrer tes repas et suivre tes objectifs nutritionnels.'
  }
};

function showTab(name){
  S.tab = name;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('on', b.dataset.tab === name);
  });
  if(name === 'quotidien'){ renderQuotidien(); return; }
  if(name === 'programme'){ renderProgramme(); return; }
  const t = TABS[name];
  $('#tabContent').innerHTML =
      '<div class="empty">'
    + '<div class="big">'+t.icon+'</div>'
    + '<b style="display:block;color:var(--ink);font-size:16px;margin-bottom:8px">'+esc(t.title)+'</b>'
    + '<p>'+esc(t.text)+'</p>'
    + '</div>';
}

function showToast(message, isError){
  const t = $('#ciToast');
  t.textContent = message;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

/* ===========================================================================
   SUIVI QUOTIDIEN — formulaire complet (spec donnée par Ron, 2026-08-26).
   Pas de sauvegarde serveur pour cette itération : le bilan est envoyé
   directement en WhatsApp au coach (bouton en bas), qui reçoit le message
   déjà formaté. Les champs texte lisent/écrivent directement dans `ci` pour
   ne rien perdre si le client change d'onglet et revient.
   =========================================================================== */
const COACH_WHATSAPP = '262693200874';

const CI_OPTIONS = {
  tabac:     ['Je ne fume pas', '0', '1-2', '3-4', '5'],
  cycle:     ['FOLLICULAIRE', 'OVULATION', 'LUTÉALE', 'RÈGLES', 'NON SUIVI'],
  activites: [
    { v:'coach',  label:'PROG COACH RON',      sub:'Séance individualisée' },
    { v:'salle',  label:'PROG SALLE EASTBOX',  sub:'Séance collective' },
    { v:'repos',  label:'REST DAY',            sub:'Repos' },
    { v:'autres', label:'AUTRES',              sub:'À détailler' }
  ]
};

const CI_EMOJI = {
  sommeilQ:  [ {v:'MAUVAIS',e:'😪'}, {v:'MOYENNE',e:'😐'}, {v:'BONNE',e:'🙂'}, {v:'TOP',e:'😄'} ],
  nutrition: [ {v:'Hors cadre',e:'🍔'}, {v:'Correcte',e:'🥖'}, {v:'Carrée',e:'🥗'} ]
};

// Valeurs par défaut alignées sur le tracker fusionné (7h de sommeil, formes
// à 3/5, stress à 5/10... — un curseur pré-positionné plutôt qu'à zéro,
// l'athlète ajuste plutôt que de tout renseigner depuis rien).
let ci = {
  avant:'', sommeilH:7, sommeilQ:null, reveil:3, douleurs:'',
  nutrition:null, hydraL:0, stress:5, tabac:null, cycle:null,
  activites:[], activitesAutre:'', duration:60, rpe:7,
  energieSoir:3, rpeCognitif:5, motCoach:''
};

function ciPillGroup(groupKey, options){
  const current = ci[groupKey];
  return '<div class="ci-pills">' + options.map(val => {
    const on = current === val ? ' on' : '';
    return '<button type="button" class="ci-pill'+on+'" onclick="ciPillClick(this,\''+groupKey+'\',\''+val.replace(/'/g,"\\'")+'\')">'+esc(val)+'</button>';
  }).join('') + '</div>';
}

function ciPillClick(btn, groupKey, val){
  const already = btn.classList.contains('on');
  btn.parentElement.querySelectorAll('.ci-pill').forEach(b => b.classList.remove('on'));
  if(already){ ci[groupKey] = null; }
  else { btn.classList.add('on'); ci[groupKey] = val; }
}

function ciActiviteClick(btn, val){
  btn.classList.toggle('on');
  const i = ci.activites.indexOf(val);
  if(btn.classList.contains('on')){ if(i < 0) ci.activites.push(val); }
  else if(i >= 0){ ci.activites.splice(i, 1); }
  const detail = $('#ciAutresDetail');
  if(detail) detail.classList.toggle('hide', !ci.activites.includes('autres'));
  const hasTraining = ci.activites.some(a => a !== 'repos');
  const block = $('#ciTrainingBlock');
  if(block) block.classList.toggle('on', hasTraining);
}

function ciHydraAdd(delta){
  ci.hydraL = Math.max(0, Math.round((ci.hydraL + delta) * 2) / 2);
  $('#ciHydraVal').textContent = ci.hydraL.toFixed(1) + ' L';
}

function ciCounter(){
  return '<div class="ci-card"><div class="ci-label">🌙 Sommeil <span class="ci-opt">Combien d\'heures ?</span></div>'
    + '<div class="ci-counter">'
    + '<button type="button" class="ci-counter-btn" onclick="ciCounterAdd(-0.5)">−</button>'
    + '<div class="ci-counter-val" id="ciSommeilHVal">'+ci.sommeilH+'h</div>'
    + '<button type="button" class="ci-counter-btn" onclick="ciCounterAdd(0.5)">+</button>'
    + '</div></div>';
}
function ciCounterAdd(delta){
  ci.sommeilH = Math.max(3, Math.min(12, ci.sommeilH + delta));
  $('#ciSommeilHVal').textContent = ci.sommeilH + 'h';
}

function ciEmojiGroup(groupKey){
  const opts = CI_EMOJI[groupKey];
  const current = ci[groupKey];
  return '<div class="ci-emoji-group cols-'+opts.length+'">' + opts.map(o => {
    const on = current === o.v ? ' on' : '';
    return '<button type="button" class="ci-emoji-btn'+on+'" onclick="ciEmojiClick(this,\''+groupKey+'\',\''+o.v.replace(/'/g,"\\'")+'\')"><span class="e">'+o.e+'</span><span class="l">'+esc(o.v)+'</span></button>';
  }).join('') + '</div>';
}
function ciEmojiClick(btn, groupKey, val){
  const already = btn.classList.contains('on');
  btn.parentElement.querySelectorAll('.ci-emoji-btn').forEach(b => b.classList.remove('on'));
  if(already){ ci[groupKey] = null; }
  else { btn.classList.add('on'); ci[groupKey] = val; }
}

function ciSegmented(icon, label, helper, key, max){
  const val = ci[key];
  let bars = '';
  for(let i = 1; i <= max; i++){
    bars += '<div class="ci-segmented-bar'+(i <= val ? ' on' : '')+'" onclick="ciSegmentedClick(\''+key+'\','+i+')"></div>';
  }
  return '<div class="ci-card"><div class="ci-label">'+icon+' '+esc(label)+(helper ? ' <span class="ci-opt">'+esc(helper)+'</span>' : '')+'</div>'
    + '<div class="ci-segmented"><div class="ci-segmented-val" id="ciSegVal_'+key+'">'+val+'<span>/'+max+'</span></div>'
    + '<div class="ci-segmented-bars" id="ciSegBars_'+key+'">'+bars+'</div></div></div>';
}
function ciSegmentedClick(key, val){
  ci[key] = val;
  $('#ciSegVal_'+key).innerHTML = val + '<span>/'+$('#ciSegBars_'+key).children.length+'</span>';

function sendBilanWhatsApp(){
  const dateStr = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const hasTraining = ci.activites.some(a => a !== 'repos');
  let m = '📋 *' + (S.isUpdate ? 'Bilan modifié' : 'Bilan du jour') + '* — ' + (S.user ? S.user.name : '') + ' — ' + dateStr + '\n\n';

  m += '*A) Avant tout*\n' + (ci.avant.trim() || '—') + '\n\n';

  m += '*B) Bilan journée*\n';
  m += ciLine('🌙 Sommeil', ci.sommeilH, ' h');
  m += ciLine('💤 Qualité', ci.sommeilQ);
  m += ciLine('☀️ Forme au réveil', ci.reveil, '/5');
  m += ciLine('🩹 Douleurs', ci.douleurs || 'RAS');
  m += ciLine('🍴 Nutrition', ci.nutrition);
  m += ciLine('💧 Hydratation', ci.hydraL.toFixed(1), ' L');
  m += ciLine('⚡ Stress', ci.stress, '/10');
  m += ciLine('🚬 Tabac', ci.tabac);
  if(S.user && S.user.showCyclePhase) m += ciLine('🌸 Phase du cycle', ci.cycle);
  m += '\n';

  const actLabels = {
    coach:  'PROG COACH RON - Séance individualisée',
    salle:  'PROG SALLE EASTBOX - Séance Collective',
    repos:  'REST DAY - Repos',
    autres: 'AUTRES' + (ci.activitesAutre ? (' : ' + ci.activitesAutre) : '')
  };
  m += '*C) Bilan séance*\n';
  m += ciLine('🏋️ Activité', ci.activites.length ? ci.activites.map(a => actLabels[a]).join(', ') : null);
  if(hasTraining){
    m += ciLine('⏱️ Durée', formatDuration(ci.duration));
    m += ciLine('🔥 RPE physique', ci.rpe, '/10');
  }
  m += ciLine('⚡ Énergie fin de journée', ci.energieSoir, '/5');
  m += ciLine('🧠 RPE cognitif', ci.rpeCognitif, '/10');
  m += '\n';

  m += '*D) Mot pour le coach*\n' + (ci.motCoach.trim() || '—');

  // Sync Sheets en parallèle, fire-and-forget, AVANT la navigation WhatsApp.
  // keepalive : la requête survit à la navigation qui suit immédiatement
  // (sans ça, elle serait annulée sur iOS Safari). Content-Type text/plain
  // (pas application/json) : même raison que dans api() plus haut — évite le
  // préflight CORS, qu'Apps Script ne gère pas nativement. Repris ici SANS
  // mode:'no-cors' (contrairement à une 1ère version) : 'no-cors' interdit
  // tout header hors d'une courte liste fixe (Content-Type n'en fait partie
  // qu'avec les valeurs text/plain, application/x-www-form-urlencoded ou
  // multipart/form-data) — la combiner avec un header hors-liste fait
  // échouer l'envoi silencieusement, requête jamais partie (bug identifié
  // 2026-08-27 : le message WhatsApp partait bien, mais rien n'arrivait
  // jamais dans le Sheet). On se moque de lire la réponse (fire-and-forget),
  // donc le mode CORS normal suffit — c'est le même que api(), déjà éprouvé.
  if(S.token){
    try{
      fetch(API, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(Object.assign({ action:'indivBilanSubmit', token:S.token }, ci, {
          duration: hasTraining ? ci.duration : 0,
          rpe: hasTraining ? ci.rpe : ''
        })),
        keepalive: true
      }).catch(() => {});
    }catch(_){}
  }

  window.location.href = 'https://wa.me/' + COACH_WHATSAPP + '?text=' + encodeURIComponent(m);
}

/* ===========================================================================
   PROGRAMME D'ENTRAÎNEMENT — plan hebdo écrit par Coach Ron (Drive,
   PROG INDIV/<athleteId>/, nomenclature ## SÉANCE 1/2/3, ### bloc — pas de
   jour fixe, volontaire : une séance individuelle se fait "dans la
   semaine", pas à une date imposée) + logging commentaire/vidéo après
   chaque séance. Repris du tracker fusionné (ONGLET ENTRAINEMENT).
   =========================================================================== */
// Relevé à 60 (était 25) le 2026-08-27 : l'envoi est maintenant découpé en
// petits morceaux (voir uploadVideoChunked ci-dessous), donc la taille totale
// n'est plus contrainte par un seul envoi fragile.
const MAX_VIDEO_MB = 60;
const VIDEO_CHUNK_MB = 4;
let planRefDate = new Date();
let _planSeances = [];
let _planActiveIdx = 0;
let _planActiveWeek = null;
let _planActiveYear = null;
// Dernier log connu par exercice pour la semaine affichée — clé "séance|exercice".
// Alimente le badge "déjà envoyé" + le pré-remplissage du commentaire.
let _planLogs = {};

function isoWeekOfDate(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return { week, year: d.getUTCFullYear() };
}
function isoWeekMonday(week, year){
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const jan4Day = jan4.getUTCDay() || 7;
  const week1Monday = new Date(jan4);
  week1Monday.setUTCDate(jan4.getUTCDate() - jan4Day + 1);
  const target = new Date(week1Monday);
  target.setUTCDate(week1Monday.getUTCDate() + (week - 1) * 7);
  return target;
}
function weekLabelStr(week, year){
  const mon = isoWeekMonday(week, year);
  const sun = new Date(mon); sun.setUTCDate(sun.getUTCDate() + 6);
  const fmt = d => String(d.getUTCDate()).padStart(2,'0') + '.' + String(d.getUTCMonth()+1).padStart(2,'0');
  return 'Semaine ' + week + ' - ' + fmt(mon) + '-' + fmt(sun) + ' - ' + year;
}
function isSameIsoWeek(a, b){ return a.week === b.week && a.year === b.year; }

function renderProgramme(){
  $('#tabContent').innerHTML =
      '<div class="plan-week-nav">'
    + '<button type="button" class="plan-week-nav-btn" onclick="planShiftWeek(-7)">‹</button>'

    + '<div class="plan-history-link" onclick="loadWeekList()">📅 Toutes les semaines</div>'
    + '<div id="planContent"><div class="spin"></div></div>';
  loadPlan();
}
function planShiftWeek(days){ planRefDate.setDate(planRefDate.getDate() + days); loadPlan(); }
function planGoToday(){ planRefDate = new Date(); loadPlan(); }

async function loadPlan(){
  const box = $('#planContent');
  const { week, year } = isoWeekOfDate(planRefDate);
  _planActiveWeek = week; _planActiveYear = year;
  const isCurrent = isSameIsoWeek({week,year}, isoWeekOfDate(new Date()));
  $('#planTodayLink').classList.toggle('hide', isCurrent);
  box.innerHTML = '<div class="spin"></div>';
  try{
    const [res, logsRes] = await Promise.all([
      api({ action:'indivPlan', token:S.token, week, year }),
      api({ action:'indivTrainingLogsForWeek', token:S.token, week, year }).catch(() => null)
    ]);

    _planLogs = {};
    if(logsRes && logsRes.ok && logsRes.logs){
      logsRes.logs.forEach(l => { _planLogs[l.seance + '|' + l.exercice] = l; });
    }

    if(!res.ok || res.empty || !res.content){
      $('#planWeekLabel').textContent = (res && res.weekLabel) || weekLabelStr(week, year);
      box.innerHTML = '<div class="empty"><div class="big">📋</div>Pas de plan écrit pour cette semaine.<br>Demande à Coach Ron.</div>';
      return;
    }
    $('#planWeekLabel').textContent = res.weekLabel;
    renderPlanDoc(res.content, box);
  }catch(err){
    console.warn('Chargement plan échoué:', err);
    box.innerHTML = '<div class="empty"><div class="big">⚠️</div>Impossible de charger le plan.<br>Vérifie ta connexion et réessaie.</div>';
  }
}

async function loadWeekList(){
  const box = $('#planContent');

      const isCur = isSameIsoWeek(w, nowIso);

    box.innerHTML = '<div class="plan-history-back" onclick="loadPlan()">‹ Retour au plan</div><div class="empty"><div class="big">⚠️</div>Impossible de charger l\'historique.</div>';
  }
}
function planPickWeek(week, year){ planRefDate = isoWeekMonday(week, year); loadPlan(); }

function renderPlanDoc(md, container){
  const body = md.replace(/^---[\s\S]*?---\s*/, '');
  const lines = body.split('\n');
  const seances = []; let current = null;
  lines.forEach(line => {
    const seanceMatch = line.match(/^##\s+(.+)$/);
    const blocMatch = !seanceMatch && line.match(/^###\s+(.+)$/);
    if(seanceMatch){ current = { title: seanceMatch[1].trim(), blocs: [] }; seances.push(current); }
    else if(blocMatch && current){ current.blocs.push({ title: blocMatch[1].trim(), raw: [] }); }
    else if(current && current.blocs.length){ current.blocs[current.blocs.length-1].raw.push(line); }
  });
  if(!seances.length){
    container.innerHTML = '<div class="empty"><div class="big">⚠️</div>Plan trouvé mais illisible — signale-le à Coach Ron.</div>';
    return;
  }
  seances.forEach(s => {
    const m = s.title.match(/^S[ÉE]ANCE\s*(\d+)\s*[-–:]?\s*(.*)$/i);
    s.tabLabel = m ? ('SÉANCE ' + m[1]) : s.title;
    s.mainTitle = m && m[2] ? m[2] : s.title;
  });
  _planSeances = seances; _planActiveIdx = 0;
  container.innerHTML =
      '<div class="days" id="planTabs">' + seances.map((s,idx) => '<button type="button" class="day'+(idx===0?' on':'')+'" onclick="pickSeance('+idx+')">'+esc(s.tabLabel)+'</button>').join('') + '</div>'
    + '<div id="planSeanceDoc"></div>';
  renderSeanceDoc(0);
}
function pickSeance(idx){
  _planActiveIdx = idx;
  document.querySelectorAll('#planTabs .day').forEach((btn,i) => btn.classList.toggle('on', i === idx));
  renderSeanceDoc(idx);
}
// Un espace commentaire + vidéo PAR EXERCICE (### bloc), juste en dessous de
// son contenu — mais UN SEUL bouton d'envoi tout en bas de la séance (Ron,
// 2026-08-27). Au clic : chaque exercice rempli (commentaire et/ou vidéo)
// est écrit dans le Sheet ENTRAINEMENT_LOGS (exercice + détails + commentaire
// — pas la vidéo, elle part sur Drive) puis un seul message WhatsApp est
// composé avec uniquement les exercices remplis (nom, détails du plan,
// commentaire, lien vidéo si présent) et envoyé au coach.
function renderSeanceDoc(idx){
  const s = _planSeances[idx];
  const box = $('#planSeanceDoc');
  if(!s || !box) return;
  box.innerHTML =
      '<div class="plan-doc-title">'+esc(s.mainTitle)+'</div>'

        const prior = _planLogs[s.title + '|' + b.title];
        const badge = prior
          ? '<div class="plan-log-badge">✓ Déjà envoyé à '+esc(fmtHHMM(prior.horodatage))+' · modification possible</div>'
          : '';
        const videoNote = (prior && prior.hasVideo)
          ? '<div class="plan-video-hint">📹 Au moins une vidéo a déjà été envoyée pour cet exercice — en sélectionner de nouvelles les remplace.</div>'
          : '';
        const priorComment = prior ? esc(prior.comment || '') : '';
        return '<div class="doc"><h3>'+esc(b.title)+'</h3>'+renderBlocLines(b.raw)+'</div>'
          + '<div class="plan-log">'
          + badge
          + '<textarea class="ci-textarea" id="planLogComment_'+bIdx+'" placeholder="Ton ressenti sur cet exercice (optionnel)...">'+priorComment+'</textarea>'
          + '<label class="plan-log-video"><input type="file" accept="video/*" multiple id="planLogFile_'+bIdx+'" onchange="planLogFileChange('+bIdx+')"><span id="planLogFileText_'+bIdx+'">📹 Ajouter une ou plusieurs vidéos</span></label>'
          + videoNote
          + '<div class="plan-video-hint">Quelques secondes suffisent (1 rep) · max '+MAX_VIDEO_MB+' Mo par vidéo</div>'
          + '</div>';
      }).join('')
    + '<button type="button" class="plan-log-submit" id="planLogSubmitBtn" onclick="submitAllTrainingLogs()">📲 ENVOYER À COACH RON</button>';
}
function fmtHHMM(iso){
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function planLogFileChange(bIdx){
  const files = $('#planLogFile_'+bIdx).files;
  const span = $('#planLogFileText_'+bIdx);
  if(!files.length){ span.textContent = '📹 Ajouter une ou plusieurs vidéos'; return; }
  span.textContent = files.length === 1 ? ('✓ ' + files[0].name) : ('✓ ' + files.length + ' vidéos sélectionnées');
}
function renderBlocLines(lines){
  let html = ''; let inList = false;
  lines.forEach(l => {
    const t = l.trim(); if(!t) return;
    if(t.startsWith('- ')){ if(!inList){ html += '<ul>'; inList = true; } html += '<li>'+inlineMd(t.slice(2))+'</li>'; }
    else { if(inList){ html += '</ul>'; inList = false; } html += '<p>'+inlineMd(t)+'</p>'; }
  });
  if(inList) html += '</ul>';
  return html || '<p>—</p>';
}
function inlineMd(s){
  return esc(s)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}
// Version texte brut (pas HTML) des lignes d'un bloc — pour le Sheet et le
// message WhatsApp : liens gardés en clair "texte (url)" plutôt qu'en HTML.
// Assainit un texte destiné à un message WhatsApp : remplace les tirets
// longs (— U+2014, – U+2013) par un tiret simple. Ils s'affichent bien chez
// Ron, mais ils font partie des rares caractères non-ASCII venant des .md de
// plan, et le tiret simple est visuellement équivalent — autant supprimer la
// variable (2026-08-27, voir le commentaire dans submitAllTrainingLogs).
function waSafe(s){
  return String(s == null ? '' : s).replace(/[–—]/g, '-');
}
// Sert au message WhatsApp ET au Sheet (même texte pour les deux) — liens
// hypertexte retirés (Ron, 2026-08-27) : juste le texte du lien, pas l'URL.
function blocDetailsText(lines){
  return lines.map(l => l.trim()).filter(Boolean).map(l => {
    let t = l.startsWith('- ') ? l.slice(2) : l;
    t = t.replace(/\*\*(.+?)\*\*/g, '$1').replace(/\*(.+?)\*/g, '$1');
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '$1');
    return '• ' + t;
  }).join('\n');
}
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// Envoie une vidéo en petits morceaux séquentiels plutôt qu'en un seul gros
// paquet (2026-08-27, retour de Ron : les vidéos filmées au téléphone
// passaient mal — soit rejetées par la limite, soit en échec net après un
// moment, probablement un timeout réseau sur un fichier trop lourd envoyé
// d'un coup). Chaque morceau part indépendamment ; Apps Script les
// réassemble au dernier (voir actionIndivTrainingLogChunk). Convertir en
// base64 morceau par morceau (plutôt que le fichier entier d'un coup) évite
// aussi de figer l'appli sur un téléphone modeste le temps de la conversion.
async function uploadVideoChunked(file, meta, onProgress){
  const chunkSize = VIDEO_CHUNK_MB * 1024 * 1024;
  const total = Math.ceil(file.size / chunkSize) || 1;
  const uploadId = Date.now() + '_' + Math.random().toString(36).slice(2, 10);
  let lastRes = null;
  for(let index = 0; index < total; index++){
    const start = index * chunkSize;
    const chunkBlob = file.slice(start, Math.min(start + chunkSize, file.size));
    const chunkBase64 = await fileToBase64(chunkBlob);
    if(onProgress) onProgress(index + 1, total);
    lastRes = await api(Object.assign({
      action:'indivTrainingLogChunk', token:S.token, uploadId, index, total,
      chunk: chunkBase64, videoName: file.name, videoMime: file.type
    }, meta));
    if(!lastRes.ok) throw new Error(lastRes.error || 'Erreur d\'envoi vidéo (morceau '+(index+1)+'/'+total+')');
  }
  return lastRes.videoUrl || '';
}

      if(!res.ok) throw new Error(res.error || 'Erreur serveur');

    // Emoji : n'utiliser QUE ceux vus s'afficher correctement sur l'iPhone

    //                     séance 1, capture du 27/08 ; j'avais cru à tort
    //                     qu'il passait en le déduisant d'une capture du

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
