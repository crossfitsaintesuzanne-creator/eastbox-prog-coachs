<style>
/* ===========================================================================
   EASTBOX — PROG COACHS
   Aucun secret dans ce fichier. Toute l'autorisation est côté Apps Script.
   =========================================================================== */
:root{
  --navy:#14233c; --navy-2:#1b2e4d; --navy-3:#24395e;
  --orange:#ea8d49; --orange-d:#c9752f;
  --ink:#eef2f8; --muted:#8ea0bd; --line:rgba(255,255,255,.09);
  --ok:#6ec06e; --warn:#e8c15a; --err:#e06666;
  --r:14px; --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--navy); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55;
  min-height:100dvh; overscroll-behavior-y:none;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{margin:0;font-weight:700}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;font-size:16px} /* 16px = pas de zoom auto iOS */
.mono{font-family:'JetBrains Mono',monospace}
.display{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;font-weight:400}
.hide{display:none !important}

/* ---------- Barre du haut ---------- */
header{
  position:sticky; top:0; z-index:50;
  background:rgba(20,35,60,.93); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  display:flex; align-items:center; gap:12px;
}
.brand-logo{height:34px;width:auto;display:block}
.spacer{flex:1}
.who{font-size:12px;color:var(--muted);text-align:right;line-height:1.25}
.who b{color:var(--ink);display:block;font-size:13px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;background:var(--navy-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:16px;
  transition:background .15s;
}
.icon-btn:active{background:var(--navy-3)}
.back{
  display:inline-flex;align-items:center;gap:7px;color:var(--muted);
  font-size:13px;font-weight:600;padding:9px 0;
}
.back:active{color:var(--orange)}
main{padding:var(--pad);max-width:840px;margin:0 auto}

/* ---------- Écran connexion ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card-login{
  width:100%;max-width:380px;background:var(--navy-2);
  border:1px solid var(--line);border-radius:20px;padding:30px 24px;
  box-shadow:0 22px 60px rgba(0,0,0,.42);
}
.logo{display:flex;justify-content:center}
.logo img{width:100%;max-width:240px;height:auto;display:block}
.logo-sub{
  text-align:center;color:var(--muted);font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;margin:8px 0 26px;
}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 7px;font-weight:600}
.field{margin-bottom:16px}
input[type=text],input[type=password]{
  width:100%;padding:13px 14px;border-radius:11px;
  background:var(--navy);border:1.5px solid var(--line);color:var(--ink);
  outline:none;transition:border-color .15s;
}
input:focus{border-color:var(--orange)}
.btn{
  width:100%;padding:14px;border-radius:11px;
  background:var(--orange);color:#10192b;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;font-size:13px;
  transition:transform .1s,background .15s;
}
.btn:active{transform:scale(.98);background:var(--orange-d)}
.btn[disabled]{opacity:.55;pointer-events:none}
.msg{
  margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13px;
  background:rgba(224,102,102,.12);border:1px solid rgba(224,102,102,.3);color:#f4b4b4;
}

/* ---------- Tuiles disciplines ---------- */
.section-title{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin:22px 0 12px;
}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.tile{
  position:relative;background:var(--navy-2);border:1px solid var(--line);
  border-radius:var(--r);padding:18px 16px;text-align:left;overflow:hidden;
  transition:transform .12s,border-color .15s;
}
.tile:active{transform:scale(.975)}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--orange))}
.tile-name{font-family:'Bebas Neue',sans-serif;font-size:23px;line-height:1.05;letter-spacing:.02em}
.tile-count{font-size:12px;color:var(--muted);margin-top:5px}
.tile-count b{color:var(--c,var(--orange));font-family:'JetBrains Mono',monospace}

/* ---------- Recherche ---------- */
.search{
  width:100%;padding:12px 14px;border-radius:11px;margin-bottom:16px;
  background:var(--navy-2);border:1.5px solid var(--line);color:var(--ink);outline:none;
}
.search:focus{border-color:var(--orange)}

/* ---------- Liste des semaines ---------- */
.week{
  background:var(--navy-2);border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:10px;overflow:hidden;
}
.week-head{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:14px 15px;text-align:left;
}
.week-head:active{background:var(--navy-3)}
.week-num{
  font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;
  min-width:52px;color:var(--c,var(--orange));
}
.week-meta{flex:1;min-width:0}
.week-meta .t{display:block;font-weight:600;font-size:14px}
.week-meta .s{display:block;font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--muted);font-size:13px;transition:transform .18s}
.week.open .chev{transform:rotate(90deg)}
.week-body{display:none;border-top:1px solid var(--line);padding:6px}
.week.open .week-body{display:block}
.file{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:9px;text-align:left;font-size:14px;
}
.file:active{background:var(--navy-3)}
.file .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .p small{display:block;color:var(--muted);font-size:11px;margin-top:1px}

/* ---------- Onglets jours ---------- */
.days{
  display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.days::-webkit-scrollbar{display:none}
.day{
  flex:0 0 auto;padding:9px 15px;border-radius:999px;
  background:var(--navy-2);border:1px solid var(--line);
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;
}
.day.on{background:var(--orange);color:#10192b;border-color:var(--orange)}

/* ---------- Rendu markdown ---------- */
.doc{
  background:var(--navy-2);border:1px solid var(--line);
  border-radius:var(--r);padding:20px 18px;
}
.doc h1,.doc h2{
  font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.02em;
  color:var(--orange);line-height:1.12;
  margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);
}
.doc h1{font-size:29px} .doc h2{font-size:24px}
.doc h3{font-size:14px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink);margin:22px 0 9px}
.doc h4{font-size:13px;color:var(--muted);margin:16px 0 7px;letter-spacing:.06em;text-transform:uppercase}
.doc > :first-child{margin-top:0}
.doc p{margin:0 0 11px}
.doc ul,.doc ol{margin:0 0 13px;padding-left:21px}
.doc li{margin-bottom:5px}
.doc li::marker{color:var(--orange)}
.doc strong{color:#fff}
.doc em{color:var(--muted);font-style:italic}
.doc hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.doc blockquote{
  margin:0 0 13px;padding:10px 14px;border-left:3px solid var(--orange);
  background:rgba(234,141,73,.08);border-radius:0 9px 9px 0;color:#f0d9c3;
}
.doc code{
  font-family:'JetBrains Mono',monospace;font-size:.87em;
  background:var(--navy);padding:2px 6px;border-radius:5px;color:var(--orange);
}
.doc pre{
  background:var(--navy);border:1px solid var(--line);border-radius:10px;
  padding:13px;overflow-x:auto;margin:0 0 13px;
}
.doc pre code{background:none;padding:0;color:var(--ink)}
.doc a{color:var(--orange)}
.doc img{max-width:100%;border-radius:10px}
.table-wrap{overflow-x:auto;margin:0 0 15px;-webkit-overflow-scrolling:touch}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:320px}
.doc th,.doc td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
.doc th{background:var(--navy-3);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.doc tbody tr:nth-child(even){background:rgba(255,255,255,.022)}

/* ---------- États ---------- */
.empty{text-align:center;color:var(--muted);padding:52px 20px;font-size:14px}
.empty .big{font-size:38px;margin-bottom:12px;opacity:.5}
.spin{
  width:26px;height:26px;margin:44px auto;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--orange);
  animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.doc-meta{font-size:11.5px;color:var(--muted);margin:0 0 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{
  display:inline-block;padding:3px 10px;border-radius:999px;font-size:10.5px;
  font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  background:var(--c,var(--orange));color:#10192b;
}

/* ---------- Kids : groupes d'âge, blocs, séances ---------- */
.pills{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill-btn{
  flex:0 0 auto;padding:9px 15px;border-radius:999px;
  background:var(--navy-2);border:1px solid var(--line);
  font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);white-space:nowrap;
}
.pill-btn.on{background:var(--c,var(--orange));color:#10192b;border-color:var(--c,var(--orange))}
.seance-row{
  width:100%;display:flex;align-items:center;gap:12px;
  background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;margin-bottom:9px;text-align:left;
}
.seance-row.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.seance-row.done{border-color:var(--err);box-shadow:0 0 0 1px var(--err) inset}
.seance-row .d{width:44px;text-align:center;flex:0 0 auto}
.seance-row .d .num{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;color:var(--ink)}
.seance-row .d .mon{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seance-row .meta{flex:1;min-width:0}
.seance-row .meta .t{font-weight:600;font-size:14px;display:block}
.seance-row .meta .s{font-size:12px;color:var(--muted);margin-top:2px;display:block}
.seance-row .badge{
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;background:var(--orange);color:#10192b;flex:0 0 auto;
}
.seance-row .badge.done{background:var(--err);color:#fff}
.step{background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.step.test{border-color:var(--warn)}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.step-label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
.step.test .step-label{color:var(--warn)}
.step-dur{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);background:var(--navy);padding:3px 9px;border-radius:999px;flex:0 0 auto}
.step-detail{font-size:14px;color:var(--ink);line-height:1.55}
.step-detail strong{color:#fff}

/* ---------- Écran d'accueil : séances du jour ---------- */
.today-card{
  background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;margin-bottom:12px;
}
.today-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.today-head .t{flex:1;min-width:0}
.today-head .t b{display:block;font-size:14px;font-weight:600}
.today-head .t span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.today-open{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.today-card:active .today-open{color:var(--orange)}
.today-empty{
  text-align:center;color:var(--muted);padding:22px 16px;font-size:13px;
  background:var(--navy-2);border:1px dashed var(--line);border-radius:var(--r);margin-bottom:12px;
}

@media(min-width:640px){ :root{--pad:22px} .doc{padding:26px 24px} }
@media print{
  header,.days,.back,.doc-meta{display:none}
  body{background:#fff;color:#000} .doc{border:0;background:#fff;padding:0}
  .doc h1,.doc h2{color:#000}
}
</style>
</head>

<script>
/* ===========================================================================
   CONFIGURATION — une seule ligne à remplir
   Colle ici l'URL /exec de ton déploiement Apps Script.
   =========================================================================== */
const API = 'https://script.google.com/macros/s/AKfycbyiug_GyeZa-lgbbIB7TQZ_3_p8pIpRwxF0ICYuWUXQ5NbKcj6pH3dMsVBspScEYB9pMg/exec';

/* ===========================================================================
   ÉTAT
   =========================================================================== */
const S = { token:null, user:null, items:[], disc:null, file:null, day:null,
            kidsDocs:{}, kidsAge:null, kidsBloc:null };
const $  = s => document.querySelector(s);
const view = $('#view');

/* ===========================================================================
   APPELS RÉSEAU
   Content-Type text/plain : évite le préflight OPTIONS que Apps Script ne
   sait pas traiter. Le corps reste du JSON, doPost le parse normalement.
   =========================================================================== */
async function api(payload){
  if(API.indexOf('script.google.com') === -1){
    throw new Error("L'URL du script n'est pas configurée dans index.html (constante API).");
  }
  const r = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload),
    redirect:'follow'
  });
  if(!r.ok) throw new Error('Serveur injoignable ('+r.status+')');
  const data = await r.json();
  if(data.logout){ logout('Session expirée, reconnecte-toi.'); throw new Error('Session expirée'); }
  return data;
}

/* ===========================================================================
   CONNEXION
   =========================================================================== */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), msg = $('#loginMsg');
  btn.disabled = true; btn.textContent = 'Connexion…'; msg.classList.add('hide');
  try{
    const res = await api({ action:'login', login:$('#u').value, pass:$('#p').value });
    if(!res.ok) throw new Error(res.error || 'Échec de la connexion');
    S.token = res.token; S.user = res.user;
    try{ localStorage.setItem('eb_prog', JSON.stringify({t:res.token,u:res.user})); }catch(_){}
    $('#p').value = '';
    start();
  }catch(err){
    msg.textContent = err.message; msg.classList.remove('hide');
  }finally{
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
});

$('#logoutBtn').addEventListener('click', () => logout());

// Force le rescan de Drive : à utiliser juste après avoir déposé une nouvelle
// semaine, sinon le cache serveur peut mettre jusqu'à 10 min à se rafraîchir.
$('#refreshBtn').addEventListener('click', () => start(true));

function logout(note){
  try{ localStorage.removeItem('eb_prog'); }catch(_){}
  S.token = S.user = null; S.items = []; S.disc = S.file = null;
  $('#app').classList.add('hide');
  $('#login').classList.remove('hide');
  if(note){ const m = $('#loginMsg'); m.textContent = note; m.classList.remove('hide'); }
}

function restore(){
  try{
    const raw = localStorage.getItem('eb_prog');
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s.t || !s.u) return false;
    S.token = s.t; S.user = s.u;
    return true;
  }catch(_){ return false; }
}

async function start(refresh){
  $('#login').classList.add('hide');
  $('#app').classList.remove('hide');
  $('#whoName').textContent = S.user.name;
  $('#whoRole').textContent = S.user.access.length + ' discipline'
                            + (S.user.access.length > 1 ? 's' : '');
  view.innerHTML = '<div class="spin"></div>';
  try{
    const res = await api({ action:'list', token:S.token, refresh: refresh ? 1 : 0 });
    if(!res.ok) throw new Error(res.error);
    S.items = res.items || [];
    screenHome();
  }catch(err){
    view.innerHTML = errorBox(err.message, 'start()');
  }
}

function errorBox(m, retry){
  return '<div class="empty"><div class="big">⚠️</div>'+esc(m)
       + '<br><br><button class="btn" style="max-width:220px;margin:0 auto"'
       + ' onclick="'+retry+'">Réessayer</button></div>';
}

/* ===========================================================================
   ÉCRAN 1 — ACCUEIL : SÉANCES DU JOUR, TOUTES SPÉCIALITÉS
   Objectif central de l'app (voir SYNTHESE_PROG_COACHS.md §1) : le coach voit
   d'abord ce qui se passe aujourd'hui, sans avoir à choisir une discipline.
   Kids en est exclu : son format n'a pas de fichier « un jour = un contenu »
   par discipline, il garde son propre écran (enterKids/screenKidsAge).
   =========================================================================== */
function screenHome(){
  S.disc = S.file = null;
  const acc = S.user.access;
  if(!acc.length){
    view.innerHTML = '<div class="empty"><div class="big">🔒</div>'
      + 'Aucune discipline ne t\'est attribuée.<br>Contacte Coach Ron.</div>';
    return;
  }
  let h = '';
  if(acc.length > 1){
    h += '<div class="section-title">Mes disciplines</div><div class="tiles">';
    acc.forEach(d => {
      // Pas de compteur ici : c'était le nombre de fichiers .md (donc de
      // semaines), affiché comme « N séances » — trompeur (un fichier CrossFit
      // = ~7 séances, un fichier Gymnastics = un cycle de 15) et sans lien
      // avec ce qu'un coach appelle une séance (question de Ron, 2026-08-21).
      h += '<button class="tile" style="--c:'+d.color+'" onclick="enterDiscipline(\''+d.key+'\')">'
         + '<div class="tile-name">'+esc(d.label)+'</div></button>';
    });
    h += '</div>';
  } else {
    h += '<button class="back" style="padding:9px 0 16px" onclick="enterDiscipline(\''+acc[0].key+'\')">'
       + 'Voir toutes les séances '+esc(acc[0].label)+' ›</button>';
  }

  h += '<div class="section-title">Aujourd\'hui</div>'
     + '<div id="todaySlot"><div class="spin"></div></div>';

  view.innerHTML = h;
  window.scrollTo(0,0);
  renderTodaySection();
}

/** Pour chaque discipline non-Kids, ouvre le fichier le plus récent, trouve le
 *  jour daté le plus proche d'aujourd'hui (nomenclature JJ/MM/AAAA), et
 *  affiche son contenu directement — sans clic supplémentaire. */
async function renderTodaySection(){
  const slot = document.getElementById('todaySlot');
  if(!slot) return;
  const discs = S.user.access.filter(a => a.key !== 'kids');
  if(!discs.length){
    slot.innerHTML = '<div class="today-empty">Pas de séance jour-par-jour pour tes disciplines.</div>';
    return;
  }

  const now = new Date();
  const { week:targetWeek, year:targetYear } = isoWeekYear(now);
  const cards = [];
  S.todayCache = S.todayCache || {};

  // Parmi une liste de fichiers (plusieurs semaines pour une même discipline
  // ou catégorie), choisir celui de la semaine calendaire visée — sinon, en
  // se déplaçant sur la semaine précédente/suivante avec shiftToday(), l'app
  // regarderait toujours le fichier le plus récent et ne trouverait jamais
  // les séances des semaines plus anciennes.
  function pickForWeek(items){
    return items.find(i => i.week === targetWeek && i.year === targetYear) || items[0];
  }

  for(const d of discs){
    const list = S.items.filter(i => i.discipline === d.key);
    if(!list.length) continue;
    const card = await loadTodayCard(d, pickForWeek(list), now);
    if(card) cards.push(card);
  }

  S.todayCards = cards;
  if(!cards.length){
    slot.innerHTML = '<div class="today-empty">Aucune séance aujourd\'hui pour tes disciplines.</div>';
    return;
  }
  if(S.todaySel === undefined || S.todaySel === null || S.todaySel >= cards.length) S.todaySel = 0;

  let h = '';
  if(cards.length > 1){
    h += '<div class="pills">';
    cards.forEach((c,i) => {
      h += '<button class="pill-btn'+(i===S.todaySel?' on':'')+'" style="--c:'+c.disc.color+'" onclick="pickToday('+i+')">'
         + esc(c.label)+'</button>';
    });
    h += '</div>';
  }
  h += '<div id="todayCard"></div>';
  slot.innerHTML = h;
  renderTodayCard();
}

/** Récupère (avec cache) le contenu d'un item et renvoie une carte « Aujourd'hui »
 *  si — et seulement si — il a une séance datée exactement aujourd'hui. */
async function loadTodayCard(disc, item, now){
  let content = S.todayCache[item.id];
  if(content === undefined){
    try{
      const res = await api({ action:'file', token:S.token, id:item.id });
      content = res.ok ? res.content : null;
    }catch(e){ content = null; }
    S.todayCache[item.id] = content;
  }
  if(!content) return null;
  const days = splitDays(content);
  const idx = nearestDatedIndex(days, now);
  if(idx < 0) return null; // fichier non conforme (§10) : pas de date exploitable
  // On ne garde que les séances réellement datées d'aujourd'hui — pas la plus
  // proche : une carte Weightlifting du mercredi n'a rien à faire un jeudi.
  if(!days[idx].date || !sameCalendarDay(days[idx].date, now)) return null;
  return { disc, item, days, idx, label: disc.label };
}

function pickToday(i){ S.todaySel = i; renderTodaySection(); window.scrollTo(0,0); }

function renderTodayCard(){
  const c = S.todayCards[S.todaySel];
  const day = c.days[c.idx];
  // day.body démarre par le titre du jour (« ## FRIDAY 21/08/2026 ») — déjà
  // affiché juste au-dessus dans l'en-tête de la carte (jour + date), donc on
  // ne le rend pas une 2e fois dans le contenu (repéré par Ron, 2026-08-21).
  const body = day.body.replace(/^##[^\n]*\n?/, '');
  document.getElementById('todayCard').innerHTML =
      '<div class="today-card" onclick="openFile(\''+c.item.id+'\','+c.idx+')">'
    + '<div class="today-head">'
    + '<span class="pill" style="--c:'+c.disc.color+'">'+esc(c.label)+'</span>'
    + '<span class="t"><b>'+esc(day.label)+' · aujourd\'hui</b>'
    + (day.date ? '<span>'+fmtNomDate(day.date)+'</span>' : '')+'</span>'
    + '<span class="today-open">Ouvrir ›</span>'
    + '</div>'
    + '<div class="doc" style="padding:0;border:0;background:none">'+md(body)+'</div>'
    + '</div>';
}

function nearestDatedIndex(days, now){
  // Comparer à minuit (pas à l'heure actuelle) : sinon en fin de journée, minuit
  // du lendemain devient numériquement plus proche que minuit du jour même, et
  // l'appli montre la séance de demain au lieu de celle d'aujourd'hui.
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let best = -1, bestDiff = Infinity;
  days.forEach((d,i) => {
    if(!d.date) return;
    const diff = Math.abs(d.date.getTime() - today.getTime());
    if(diff < bestDiff){ bestDiff = diff; best = i; }
  });
  return best;
}
function sameCalendarDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function fmtNomDate(d){
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
/** Numéro de semaine ISO (lundi=1er jour, semaine 1 = celle du 1er jeudi de
 *  l'année) — sert à choisir le bon fichier .md quand on navigue vers une
 *  semaine passée ou future sur l'écran d'accueil. */
function isoWeekYear(d){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (dt.getUTCDay() + 6) % 7; // lundi=0..dimanche=6
  dt.setUTCDate(dt.getUTCDate() - day + 3); // jeudi de cette semaine
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
  const fdDay = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - fdDay + 3);
  const week = 1 + Math.round((dt - firstThursday) / (7*86400000));
  return { week, year: dt.getUTCFullYear() };
}
/** Lundi d'une semaine ISO donnée (opération inverse d'isoWeekYear). */
function isoWeekMonday(week, year){
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const jan4Day = (jan4.getUTCDay() + 6) % 7;
  const week1Monday = new Date(Date.UTC(year, 0, 4 - jan4Day));
  // Ajouter les jours DIRECTEMENT à week1Monday (pas reconstruire une date à
  // partir de son seul quantième) : la semaine 1 démarre souvent en décembre
  // de l'année précédente, et repartir de « mois 0 / année demandée » avec
  // juste ce quantième donnait une date dans le mauvais mois (parfois même
  // le mauvais mois de la bonne année, ex. septembre au lieu d'août).
  const monday = new Date(week1Monday);
  monday.setUTCDate(monday.getUTCDate() + (week-1)*7);
  return monday;
}
/** Libellé long d'une semaine, avec sa plage de dates — ex. « Semaine 34 -
 *  17.08-23.08 - 2026 ». Format demandé par Ron partout où une semaine est
 *  nommée dans l'appli (2026-08-20). */
function weekLabel(week, year){
  if(week == null) return 'Non classé';
  const mon = isoWeekMonday(week, year);
  const sun = new Date(mon); sun.setUTCDate(sun.getUTCDate() + 6);
  const fmt = d => String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0');
  return 'Semaine '+week+' - '+fmt(mon)+'-'+fmt(sun)+' - '+year;
}

/** Un fichier sans numéro de semaine (ex. un cycle Gymnastics, une seule
 *  séance repère plusieurs semaines) tombe dans le groupe « Non classé » de
 *  renderWeeks() — pas très parlant. Quand ce groupe ne contient qu'un seul
 *  fichier, on en dérive 2 titres plus lisibles à partir de son nom : celui
 *  de la ligne fichier (sans le préfixe de discipline déjà dans le titre
 *  d'écran, sans la plage de dates déjà visible en dessous) et celui du
 *  groupe (sans le préfixe, sans le « N séances » — remplacé par la plage de
 *  dates). Ex. "GYMNASTICS - CYCLE STRICT HSPU - 15 SEANCES - 20.07-07.09 -
 *  2026" → fichier "CYCLE STRICT HSPU - 15 SEANCES", groupe "CYCLE STRICT
 *  HSPU - 20.07-07.09 - 2026" (demande de Ron, 2026-08-21). Si le nom ne suit
 *  pas ce moule, on retombe simplement sur le nom/« Non classé » d'origine.
 */
function soloCycleLabels(name, discLabel){
  const prefixRe = new RegExp('^\\s*'+discLabel.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*-\\s*','i');
  const cleaned = name.replace(prefixRe, '').trim();
  const dateSuffixRe = /\s*-\s*\d{1,2}[.\/]\d{1,2}\s*-\s*\d{1,2}[.\/]\d{1,2}\s*-\s*\d{4}\s*$/;
  const seancesRe = /\s*-\s*\d+\s+s[ée]ances?\s*-\s*/i;
  const fileTitle = cleaned.replace(dateSuffixRe, '').trim();
  const groupTitle = cleaned.replace(seancesRe, ' - ').trim();
  return { fileTitle: fileTitle || name, groupTitle: groupTitle || 'Non classé' };
}

/* ===========================================================================
   ENTRÉE DANS UNE DISCIPLINE
   On ouvre directement la séance la plus récente : c'est ce qu'un coach vient
   chercher dans 95% des cas. L'historique reste à un clic, pas à zéro.
   Si la semaine la plus récente contient plusieurs fichiers, on montre la
   liste plutôt que d'en choisir un au hasard.
   =========================================================================== */
function enterDiscipline(key){
  S.disc = key;
  // Toujours passer par l'écran « toutes les semaines » : c'est au coach de
  // choisir la semaine qu'il veut voir, pas à l'appli de deviner et ouvrir
  // une séance directement (avant, un clic sur la tuile pouvait sauter tout
  // droit dans un fichier — demande de Ron, 2026-08-21).
  if(key === 'kids'){ enterKids(S.items.filter(i => i.discipline === key)); return; }
  screenWeeks(key);
}

/* ===========================================================================
   ÉCRAN 2 — SEMAINES D'UNE DISCIPLINE
   =========================================================================== */
function screenWeeks(key){
  S.disc = key; S.file = null;
  const d = S.user.access.find(x => x.key === key);
  if(!d){ screenHome(); return; }

  const list = S.items.filter(i => i.discipline === key);
  const solo = S.user.access.length === 1;
  // Retour vers la séance en cours, seulement s'il y en a une identifiable —
  // sinon le bouton ne ferait rien et c'est pire que pas de bouton. « En cours »
  // = la semaine calendaire d'aujourd'hui, pas simplement list[0] : les fichiers
  // sont triés semaine décroissante, donc list[0] est souvent une semaine déjà
  // préparée en avance (ex. S35 avant la fin de S34) plutôt que la semaine
  // réellement en cours (demande de Ron, 2026-08-21).
  const { week: curWeek, year: curYear } = isoWeekYear(new Date());
  const top = list.find(i => i.week === curWeek && i.year === curYear) || list[0];
  const direct = top && list.filter(i => i.week === top.week && i.year === top.year).length === 1;

  let back = '';
  if(!solo)        back = '<button class="back" onclick="screenHome()">‹ Disciplines</button>';
  else if(direct)  back = '<button class="back" onclick="openFile(\''+top.id+'\')">‹ Séance en cours</button>';

  let h = back
        + '<h1 class="display" style="font-size:31px;color:'+d.color+';margin-bottom:14px">'
        + esc(d.label.toUpperCase())+'</h1>';

  if(!list.length){
    h += '<div class="empty"><div class="big">📂</div>Aucun fichier .md trouvé dans ce dossier Drive.</div>';
    view.innerHTML = h; return;
  }

  h += '<input class="search" id="q" placeholder="Rechercher une semaine, un dossier…">'
     + '<div id="weeks"></div>';
  view.innerHTML = h;
  renderWeeks(list, d.color, '', d.label);
  $('#q').addEventListener('input', e => renderWeeks(list, d.color, e.target.value, d.label));
  window.scrollTo(0,0);
}

function renderWeeks(list, color, q, discLabel){
  const term = q.trim().toLowerCase();
  const hits = term
    ? list.filter(i => (i.path + ' ' + i.name).toLowerCase().includes(term))
    : list;

  // Regroupement par semaine (clé année+semaine), non classé en dernier
  const groups = new Map();
  hits.forEach(i => {
    const k = i.week == null ? 'zz' : String(i.year || 0).padStart(4,'0') + '-' + String(i.week).padStart(2,'0');
    if(!groups.has(k)) groups.set(k, { week:i.week, year:i.year, files:[] });
    groups.get(k).files.push(i);
  });
  const keys = [...groups.keys()].sort().reverse();

  if(!keys.length){
    $('#weeks').innerHTML = '<div class="empty">Aucun résultat.</div>';
    return;
  }

  // Semaine ouverte par défaut : celle en cours aujourd'hui, pas juste la
  // première de la liste (triée semaine décroissante, donc souvent une
  // semaine déjà préparée en avance plutôt que la semaine en cours —
  // demande de Ron, 2026-08-21). Repli sur la plus récente si la semaine
  // en cours n'a pas encore de fichier.
  const cur = isoWeekYear(new Date());
  const curKey = String(cur.year).padStart(4,'0') + '-' + String(cur.week).padStart(2,'0');
  const openKey = keys.includes(curKey) ? curKey : keys[0];

  let h = '';
  keys.forEach(k => {
    const g = groups.get(k);
    const open = (k === openKey && !term) || term ? ' open' : '';
    const label = g.week == null ? '—' : 'S'+g.week;
    // Un seul fichier sans semaine (ex. cycle Gymnastics) : dériver un titre
    // de groupe et de fichier plus parlants que « Non classé » / le nom brut
    // — voir soloCycleLabels() (demande de Ron, 2026-08-21).
    const solo = g.week == null && g.files.length === 1 ? soloCycleLabels(g.files[0].name, discLabel) : null;
    // Plus de sous-titre par catégorie ici : depuis l'éclatement de Cours spé
    // en disciplines séparées (2026-08-21), un écran de semaines ne contient
    // plus qu'une seule catégorie — le titre de l'écran le dit déjà.
    h += '<div class="week'+open+'" style="--c:'+color+'">'
       + '<button class="week-head" onclick="this.parentNode.classList.toggle(\'open\')">'
       + '<span class="week-num mono">'+label+'</span>'
       + '<span class="week-meta"><span class="t">'
       +   esc(solo ? solo.groupTitle : (g.week == null ? 'Non classé' : weekLabel(g.week, g.year)))
       + '</span></span>'
       + '<span class="chev">›</span></button><div class="week-body">';
    g.files.forEach(f => {
      h += '<button class="file" onclick="openFile(\''+f.id+'\')">'
         + '<span>📄</span><span class="p">'+esc(solo ? solo.fileTitle : f.name)
         + '<small>'+fmtDate(f.date)+'</small></span>'
         + '<span class="chev">›</span></button>';
    });
    h += '</div></div>';
  });
  $('#weeks').innerHTML = h;
}

/* ===========================================================================
   KIDS — écran dédié (Pré-Kids / Kids / Teens)
   Format différent du reste : un fichier = un bloc de plusieurs semaines,
   3 groupes d'âge, séances datées en toutes lettres. Voir NOMENCLATURE_MD.md §12.
   =========================================================================== */
const KIDS_AGE = [
  { key:'PRE-KIDS', label:'Pré-Kids', c:'#6ec06e' },
  { key:'KIDS',     label:'Kids',     c:'#e8c15a' },
  { key:'TEENS',    label:'Teens',    c:'#5aa3e8' },
];
const KIDS_MONTHS = {janvier:0,'février':1,fevrier:1,mars:2,avril:3,mai:4,juin:5,juillet:6,
  'août':7,aout:7,septembre:8,octobre:9,novembre:10,'décembre':11,decembre:11};
const KIDS_MOIS_ABBR = ['JANV','FÉVR','MARS','AVR','MAI','JUIN','JUIL','AOÛT','SEPT','OCT','NOV','DÉC'];

function kidsParseDateFR(s){
  const m = s.match(/(\d{1,2})(?:er)?\s+(janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre)\s+(\d{4})/i);
  if(!m) return null;
  return new Date(parseInt(m[3],10), KIDS_MONTHS[m[2].toLowerCase()], parseInt(m[1],10));
}
function kidsParseDayName(s){
  const m = s.match(/\b(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b/i);
  return m ? m[1][0].toUpperCase()+m[1].slice(1).toLowerCase() : null;
}
function kidsParseTable(lines){
  const rows = []; let inTable = false;
  for(const raw of lines){
    const l = raw.trim();
    if(/^\|/.test(l)){
      if(/^\|\s*-+/.test(l)) continue;
      if(/^\|\s*Bloc\s*\|/i.test(l)){ inTable = true; continue; }
      if(inTable){
        const cells = l.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
        if(cells.length>=3) rows.push({ label: cells[0].replace(/\*\*/g,''), duree: cells[1], detail: cells[2] });
      }
    }
  }
  return rows;
}
function kidsParseWeeks(bodyLines){
  const weekIdx = [];
  bodyLines.forEach((l,i)=>{ if(/^##\s+SEMAINE/i.test(l.trim())) weekIdx.push(i); });
  const weeks = [];
  weekIdx.forEach((wi, idx)=>{
    const end = idx+1<weekIdx.length ? weekIdx[idx+1] : bodyLines.length;
    const heading = bodyLines[wi].trim().replace(/^##\s+/,'');
    const weekBody = bodyLines.slice(wi+1, end);
    const weekDate = kidsParseDateFR(heading);
    const seanceIdx = [];
    weekBody.forEach((l,i)=>{ if(/^###\s+/.test(l.trim())) seanceIdx.push(i); });
    let seances = [];
    if(seanceIdx.length){
      seanceIdx.forEach((si, k)=>{
        const send = k+1<seanceIdx.length ? seanceIdx[k+1] : weekBody.length;
        const shead = weekBody[si].trim().replace(/^###\s+/,'');
        const sbody = weekBody.slice(si+1, send);
        seances.push({ heading: shead, date: kidsParseDateFR(shead) || weekDate,
          day: kidsParseDayName(shead) || kidsParseDayName(heading), rows: kidsParseTable(sbody) });
      });
    } else {
      seances.push({ heading, date: weekDate, day: kidsParseDayName(heading), rows: kidsParseTable(weekBody) });
    }
    weeks.push({ heading, date: weekDate, seances });
  });
  return weeks;
}
function kidsParseDoc(text){
  const lines = String(text||'').replace(/\r\n?/g,'\n').split('\n');
  const titleLine = lines.find(l=>/^#\s+BLOC/i.test(l.trim())) || lines[0] || '';
  const blocTitle = titleLine.replace(/^#\s*/,'').trim();
  const blocNumM = blocTitle.match(/BLOC\s*(\d+)/i);
  const blocLabel = blocNumM ? 'Bloc '+blocNumM[1] : blocTitle;
  const markers = [ {emoji:'🟢', key:'PRE-KIDS'}, {emoji:'🟡', key:'KIDS'}, {emoji:'🔵', key:'TEENS'} ];
  const allH1 = [];
  lines.forEach((l,i)=>{ if(/^#\s+/.test(l.trim())) allH1.push(i); });
  const sections = [];
  lines.forEach((l,i)=>{
    const t = l.trim();
    if(!/^#\s+/.test(t)) return;
    for(const mk of markers){ if(t.includes(mk.emoji)){ sections.push({i, key:mk.key}); break; } }
  });
  const groups = {};
  sections.forEach(sec=>{
    const nextH1 = allH1.find(i=>i>sec.i);
    const end = nextH1 !== undefined ? nextH1 : lines.length;
    groups[sec.key] = { weeks: kidsParseWeeks(lines.slice(sec.i+1, end)) };
  });
  return { blocTitle, blocLabel, blocNum: blocNumM ? parseInt(blocNumM[1],10) : 0, groups };
}

function kidsAllSeances(ageKey, itemId){
  const doc = S.kidsDocs[itemId];
  const g = doc && doc.groups[ageKey];
  if(!g) return [];
  const out = [];
  g.weeks.forEach(w => w.seances.forEach(s => out.push({ ...s, weekHeading: w.heading })));
  return out;
}
function kidsNearestIndex(seances, now){
  // Comparer à minuit, pas à l'heure actuelle (sinon la fin de journée fait
  // basculer sur la séance du lendemain). Priorité à la prochaine séance à
  // venir (aujourd'hui ou après) même si une séance passée est plus proche en
  // nombre de jours — un coach veut voir ce qui arrive, pas ce qui est fini.
  // Seul un bloc entièrement terminé (aucune séance >= aujourd'hui) retombe
  // sur la séance passée la plus récente — c'est ce qui déclenche « Terminé ».
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let bestFuture = -1, bestFutureDiff = Infinity;
  let bestPast = -1, bestPastDiff = Infinity;
  seances.forEach((s,i)=>{
    if(!s.date) return;
    const diff = s.date.getTime() - today.getTime();
    if(diff >= 0){
      if(diff < bestFutureDiff){ bestFutureDiff = diff; bestFuture = i; }
    }else{
      const d = -diff;
      if(d < bestPastDiff){ bestPastDiff = d; bestPast = i; }
    }
  });
  return bestFuture >= 0 ? bestFuture : bestPast;
}
function kidsFmtDay(d){
  if(!d) return {num:'--',mon:''};
  return { num:String(d.getDate()).padStart(2,'0'), mon:KIDS_MOIS_ABBR[d.getMonth()] };
}

async function enterKids(list){
  if(!list.length){
    view.innerHTML = '<button class="back" onclick="screenHome()">‹ Disciplines</button>'
      + '<div class="empty"><div class="big">📂</div>Aucun fichier .md trouvé dans ce dossier Drive.</div>';
    return;
  }
  view.innerHTML = '<div class="spin"></div>';
  const toFetch = list.filter(i => !S.kidsDocs[i.id]);
  try{
    const results = await Promise.all(toFetch.map(i =>
      api({ action:'file', token:S.token, id:i.id }).then(r => ({ i, r })).catch(() => null)
    ));
    results.forEach(x => {
      if(x && x.r && x.r.ok) S.kidsDocs[x.i.id] = kidsParseDoc(x.r.content);
    });
  }catch(err){
    view.innerHTML = errorBox(err.message, "enterDiscipline('kids')");
    return;
  }
  S.kidsItems = list.filter(i => S.kidsDocs[i.id]).sort((a,b) =>
    (S.kidsDocs[a.id].blocNum||0) - (S.kidsDocs[b.id].blocNum||0));
  S.kidsAge = null; S.kidsBloc = null;
  screenKidsAge();
}

function screenKidsAge(){
  S.kidsAge = null; S.kidsBloc = null;
  const solo = S.user.access.length === 1;
  let h = solo ? '' : '<button class="back" onclick="screenHome()">‹ Disciplines</button>';
  h += '<div class="section-title">Pré-Kids · Kids · Teens</div><div class="tiles">';
  KIDS_AGE.forEach(a=>{
    const n = S.kidsItems.reduce((acc,i)=>acc+kidsAllSeances(a.key,i.id).length,0);
    h += '<button class="tile" style="--c:'+a.c+'" onclick="pickKidsAge(\''+a.key+'\')">'
       + '<div class="tile-name">'+esc(a.label)+'</div>'
       + '<div class="tile-count"><b>'+n+'</b> séance'+(n>1?'s':'')+'</div></button>';
  });
  h += '</div>';
  view.innerHTML = h;
  window.scrollTo(0,0);
}
function pickKidsAge(key){ S.kidsAge = key; S.kidsBloc = null; screenKidsBloc(); }

function screenKidsBloc(){
  const a = KIDS_AGE.find(x=>x.key===S.kidsAge);

  // Choisir le bloc en cours AVANT de construire les pastilles ci-dessous,
  // sinon S.kidsBloc est encore null au moment du rendu et aucune pastille
  // ne prend la couleur du groupe d'âge pour signaler le bloc affiché.
  if(!S.kidsBloc){
    let best = null, bestDiff = Infinity;
    const now = new Date();
    S.kidsItems.forEach(i=>{
      const ss = kidsAllSeances(S.kidsAge, i.id);
      const ni = kidsNearestIndex(ss, now);
      if(ni>=0){ const diff = Math.abs(ss[ni].date.getTime()-now.getTime()); if(diff<bestDiff){ bestDiff=diff; best=i.id; } }
    });
    S.kidsBloc = best || (S.kidsItems.length ? S.kidsItems[S.kidsItems.length-1].id : null);
  }

  let h = '<button class="back" onclick="screenKidsAge()">‹ Groupes d\'âge</button>'
        + '<h1 class="display" style="font-size:29px;color:'+a.c+';margin-bottom:14px">'+esc(a.label.toUpperCase())+'</h1>';
  h += '<div class="pills">';
  S.kidsItems.forEach(i=>{
    const on = S.kidsBloc===i.id ? ' on' : '';
    h += '<button class="pill-btn'+on+'" style="--c:'+a.c+'" onclick="pickKidsBloc(\''+i.id+'\')">'
       + esc(S.kidsDocs[i.id].blocLabel)+'</button>';
  });
  h += '</div><div id="kidsSeances"></div>';
  view.innerHTML = h;

  renderKidsSeances();
  window.scrollTo(0,0);
}
function pickKidsBloc(id){ S.kidsBloc = id; screenKidsBloc(); }

function renderKidsSeances(){
  const a = KIDS_AGE.find(x=>x.key===S.kidsAge);
  const target = document.getElementById('kidsSeances');
  const seances = S.kidsBloc ? kidsAllSeances(S.kidsAge, S.kidsBloc) : [];
  if(!seances.length){ target.innerHTML = '<div class="empty">Aucune séance pour ce groupe dans ce bloc.</div>'; return; }
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const ni = kidsNearestIndex(seances, now);
  // Bloc/cycle terminé : la dernière séance (chronologiquement) est déjà passée
  // et il n'y en a pas d'autre après — dans ce cas la séance « la plus proche »
  // est en réalité la dernière séance passée, pas une séance à venir.
  const last = seances[seances.length-1];
  const finished = !!(last && last.date && last.date.getTime() < today.getTime());
  let h = '';
  seances.forEach((s,i)=>{
    const d = kidsFmtDay(s.date);
    const isToday = i===ni;
    const sameLabel = s.heading === s.weekHeading;
    h += '<button class="seance-row'+(isToday?(finished?' done':' today'):'')+'" style="--c:'+a.c+'" onclick="openKidsSeance('+i+')">'
       + '<div class="d"><div class="num mono">'+d.num+'</div><div class="mon">'+d.mon+'</div></div>'
       + '<div class="meta"><span class="t">'+esc(s.weekHeading)+'</span>'
       + (sameLabel ? (s.day?'<span class="s">'+esc(s.day)+'</span>':'') : '<span class="s">'+esc(s.heading)+(s.day?' · '+esc(s.day):'')+'</span>')
       + '</div>'
       + (isToday ? (finished ? '<span class="badge done">Terminé</span>' : '<span class="badge">À venir</span>') : '')
       + '</button>';
  });
  target.innerHTML = h;
  target._seances = seances;
}
function openKidsSeance(i){
  const target = document.getElementById('kidsSeances');
  const s = target._seances[i];
  const a = KIDS_AGE.find(x=>x.key===S.kidsAge);
  let h = '<button class="back" onclick="screenKidsBloc()">‹ '+esc(a.label)+'</button>';
  h += '<div class="doc-meta" style="margin-bottom:2px"><span class="pill" style="--c:'+a.c+'">'+esc(a.label)+'</span></div>'
     + '<h1 class="display" style="font-size:27px;line-height:1.1;margin:4px 0 6px">'+esc(s.heading)+'</h1>'
     + '<div class="doc-meta">'+esc(s.weekHeading)+(s.day?' · '+esc(s.day):'')+'</div>';
  s.rows.forEach(r=>{
    const isTest = /test/i.test(r.label);
    h += '<div class="step'+(isTest?' test':'')+'">'
       + '<div class="step-head"><span class="step-label">'+inline(r.label)+'</span>'
       + '<span class="step-dur mono">'+esc(r.duree)+'</span></div>'
       + '<div class="step-detail">'+inline(r.detail)+'</div></div>';
  });
  view.innerHTML = h;
  window.scrollTo(0,0);
}

/* ===========================================================================
   ÉCRAN 3 — LECTURE D'UNE SÉANCE
   =========================================================================== */
async function openFile(id, dayIdx){
  view.innerHTML = '<div class="spin"></div>';
  window.scrollTo(0,0);
  try{
    const res = await api({ action:'file', token:S.token, id:id });
    if(!res.ok) throw new Error(res.error);
    S.file = res;
    S.day = (dayIdx === undefined) ? null : dayIdx;
    screenDoc();
  }catch(err){
    view.innerHTML = '<button class="back" onclick="screenBack()">‹ Retour</button>'
                   + '<div class="empty"><div class="big">⚠️</div>'+esc(err.message)+'</div>';
  }
}

function screenBack(){ S.disc ? screenWeeks(S.disc) : screenHome(); }

function screenDoc(){
  const f = S.file;
  const d = S.user.access.find(x => x.key === f.discipline) || { label:f.discipline, color:'#ea8d49' };
  const days = splitDays(f.content);

  let h = '<button class="back" onclick="screenBack()">‹ Toutes les semaines</button>'
        + '<h1 class="display" style="font-size:27px;line-height:1.1;margin-bottom:9px">'
        + esc(f.name)+'</h1>'
        + '<div class="doc-meta"><span class="pill" style="--c:'+d.color+'">'+esc(d.label)+'</span>'
        + '<span>Mis à jour le '+esc(f.updated)+'</span></div>';

  if(days.length > 1){
    // Un fichier multi-semaines (ex. cycle Gymnastics) répète les mêmes noms
    // de jour (LUNDI, MERCREDI, LUNDI, MERCREDI...) — dans ce cas seul, on
    // répartit les onglets par semaine avec la date, sinon comportement
    // inchangé (juste le nom du jour, comme pour un fichier CrossFit/Hyrox
    // classique qui ne couvre qu'une semaine).
    const grouped = hasDuplicateDayLabels(days) && days.every(x => x.date);

    // Regroupement par semaine (lundi→dimanche) : sert à l'accordéon ET à
    // trouver la semaine « en cours ».
    let weekGroups = null;
    if(grouped){
      weekGroups = [];
      let lastKey = null;
      days.forEach((x,i) => {
        const key = weekStartKey(x.date);
        if(key !== lastKey){ weekGroups.push({ monday:new Date(key), items:[] }); lastKey = key; }
        weekGroups[weekGroups.length-1].items.push(i);
      });
    }

    if(S.day === null || S.day >= days.length){
      if(grouped){
        // La semaine « en cours » = celle dont la plage lundi-dimanche
        // contient aujourd'hui — pas juste « la séance la plus proche » :
        // sinon, une fois les 2 séances de la semaine déjà passées (ex. jeudi
        // ou vendredi), l'app basculait sur la semaine SUIVANTE au lieu de
        // rester sur la semaine en cours (repéré par Ron sur le cycle
        // Gymnastics, 2026-08-21 : S5 affichait S6 dès le jeudi/vendredi).
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        let gi = weekGroups.findIndex(g => {
          const sunday = new Date(g.monday); sunday.setDate(sunday.getDate()+6);
          return today >= g.monday.getTime() && today <= sunday.getTime();
        });
        if(gi < 0){
          // Hors cycle (avant le début ou après la fin) : la semaine la plus proche.
          let best = 0, bestDiff = Infinity;
          weekGroups.forEach((g,i) => {
            const diff = Math.abs(g.monday.getTime() - today);
            if(diff < bestDiff){ bestDiff = diff; best = i; }
          });
          gi = best;
        }
        // Dans cette semaine, la séance la plus proche d'aujourd'hui.
        const items = weekGroups[gi].items;
        const idx = kidsNearestIndex(items.map(i => days[i]), now);
        S.day = items[Math.max(0, idx)];
      }else{
        S.day = 0;
      }
    }
    let tabs = '';
    if(grouped){
      // Une semaine par ligne (accordéon, même look que l'écran « toutes les
      // semaines »), pliée sauf celle qui contient la séance affichée : au clic
      // sur une semaine, ses jours dispo apparaissent avec le détail de la
      // séance juste en dessous — plus lisible qu'une liste à plat de toutes
      // les pastilles de tout le cycle (demande de Ron, 2026-08-21).
      weekGroups.forEach((g,gi) => {
        const sunday = new Date(g.monday); sunday.setDate(sunday.getDate()+6);
        const fmt = dd => String(dd.getDate()).padStart(2,'0')+'.'+String(dd.getMonth()+1).padStart(2,'0');
        const label = 'Semaine '+(gi+1)+' - '+fmt(g.monday)+'-'+fmt(sunday)+' - '+g.monday.getFullYear();
        const isOpen = g.items.includes(S.day);
        tabs += '<div class="week'+(isOpen?' open':'')+'" style="--c:'+d.color+'">'
           + '<button class="week-head" onclick="pickDay('+g.items[0]+')">'
           + '<span class="week-num mono">S'+(gi+1)+'</span>'
           + '<span class="week-meta"><span class="t">'+esc(label)+'</span></span>'
           + '<span class="chev">›</span></button><div class="week-body">';
        if(isOpen){
          tabs += '<div class="days">';
          g.items.forEach(i => {
            const short = DAY_SHORT[days[i].label] || days[i].label.slice(0,3);
            tabs += '<button class="day'+(i===S.day?' on':'')+'" onclick="pickDay('+i+')">'
                  + short+' '+fmtNomDate(days[i].date).slice(0,5)+'</button>';
          });
          tabs += '</div><div class="doc">'+md(days[S.day].body)+'</div>';
        }
        tabs += '</div></div>';
      });
      h += tabs;
    }else{
      tabs += '<div class="days">';
      days.forEach((x,i) => {
        tabs += '<button class="day'+(i===S.day?' on':'')+'" onclick="pickDay('+i+')">'+esc(x.label)+'</button>';
      });
      tabs += '</div>';
      h += tabs+'<div class="doc">'+md(days[S.day].body)+'</div>';
    }
  }else{
    // Un seul jour détecté (ex. Strength/Renfo/Stamina, une séance/semaine) :
    // days[0].body démarre au titre du jour, sans l'en-tête YAML qui le
    // précède dans le fichier — utiliser f.content ici l'affichait en clair
    // ("discipline: spe / semaine: 34 / annee: 2026") au-dessus de la séance
    // (repéré par Ron sur Stamina, 2026-08-21). Si aucun jour n'a été trouvé
    // du tout, days[0].body vaut déjà tout le fichier (repli tolérant de
    // splitDays), donc ce changement ne perd aucun cas.
    h += '<div class="doc">'+md(days[0].body)+'</div>';
  }
  view.innerHTML = h;
}

function hasDuplicateDayLabels(days){
  const seen = new Set();
  for(const x of days){ if(seen.has(x.label)) return true; seen.add(x.label); }
  return false;
}
function weekStartKey(d){
  const day = d.getDay(); // 0=dimanche..6=samedi
  const diff = (day === 0 ? -6 : 1 - day); // recule jusqu'au lundi de cette semaine
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()+diff).getTime();
}
const DAY_SHORT = {
  MONDAY:'LUN', TUESDAY:'MAR', WEDNESDAY:'MER', THURSDAY:'JEU', FRIDAY:'VEN', SATURDAY:'SAM', SUNDAY:'DIM',
  LUNDI:'LUN', MARDI:'MAR', MERCREDI:'MER', JEUDI:'JEU', VENDREDI:'VEN', SAMEDI:'SAM', DIMANCHE:'DIM'
};

function pickDay(i){
  S.day = i;
  screenDoc();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ===========================================================================
   DÉCOUPAGE PAR JOUR
   Tolérant : cherche un titre markdown (#..####) ou une ligne en gras qui
   contient un nom de jour, FR ou EN. Si rien n'est trouvé, un seul bloc.
   =========================================================================== */
const DAYS = [
  ['MONDAY','LUNDI'],['TUESDAY','MARDI'],['WEDNESDAY','MERCREDI'],
  ['THURSDAY','JEUDI'],['FRIDAY','VENDREDI'],['SATURDAY','SAMEDI'],['SUNDAY','DIMANCHE']
];
const DAY_RE = new RegExp('\\b(' + DAYS.flat().join('|') + ')\\b', 'i');
const NOM_DATE_RE = /(\d{2})\/(\d{2})\/(\d{4})/;
function parseNomDate(s){
  const m = s.match(NOM_DATE_RE);
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}

function splitDays(text){
  const lines = (text || '').split(/\r?\n/);
  const cuts = [];
  lines.forEach((ln, i) => {
    const t = ln.trim();
    // Uniquement niveau 2 (## = un jour, nomenclature §3) : matcher #{1,4} au
    // sens large repérait aussi des titres de bloc niveau 4 qui mentionnent un
    // jour dans leur libellé (ex. "#### Warm-up — bloc Mercredi", format des
    // séances fusionnées) et les prenait à tort pour un nouveau jour, coupant
    // la vraie séance en plein milieu. `##\s+` ne matche pas `###`/`####` car
    // le caractère juste après les 2 premiers # n'est alors pas un espace.
    const isHeading = /^##\s+/.test(t);
    const isBoldLine = /^\*\*[^*]{1,40}\*\*:?\s*$/.test(t);
    if(!isHeading && !isBoldLine) return;
    const m = t.match(DAY_RE);
    if(m) cuts.push({ i:i, label:normDay(m[1]), date:parseNomDate(t) });
  });
  // Un seul jour détecté (normal pour Strength/Renfo/Stamina & Renfo — une
  // séance unique par semaine) : garder quand même sa date, sinon la carte
  // « Aujourd'hui » ne peut jamais la faire correspondre à aujourd'hui.
  // Seul un fichier sans AUCUN jour détecté tombe dans le mode tolérant.
  if(cuts.length < 1) return [{ label:'Tout', body:text || '', date:null }];

  const days = cuts.map((c, k) => ({
    label: c.label,
    date:  c.date,
    body:  lines.slice(c.i, k+1 < cuts.length ? cuts[k+1].i : lines.length).join('\n')
  }));
  // Trier par date réelle plutôt que par ordre d'apparition dans le fichier :
  // un coach qui réorganise son .md ne doit pas se retrouver avec des onglets
  // jour dans le désordre. Les jours sans date gardent leur ordre d'origine
  // (tri stable) et restent à la fin.
  return days
    .map((d, i) => ({ d, i }))
    .sort((a, b) => {
      if(a.d.date && b.d.date) return a.d.date - b.d.date;
      if(a.d.date) return -1;
      if(b.d.date) return 1;
      return a.i - b.i;
    })
    .map(x => x.d);
}

function normDay(w){
  // On garde la langue du fichier : l'onglet dit exactement ce que dit le titre,
  // pas de décalage LUNDI / MONDAY entre l'onglet et le contenu.
  return w.toUpperCase();
}

/* ===========================================================================
   RENDU MARKDOWN — mini-moteur, volontairement tolérant.
   Gère : titres, listes (à puces / numérotées / imbriquées 1 niveau),
   tableaux, citations, blocs et code inline, gras, italique, barré,
   liens, images, séparateurs. Tout est échappé avant rendu (pas de HTML brut).
   =========================================================================== */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function inline(s){
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, (_,c)=>'<code>'+c+'</code>');
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">');
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  t = t.replace(/(^|[^_\w])_([^_\n]+)_(?![\w_])/g, '$1<em>$2</em>');
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return t;
}

function md(src){
  const lines = String(src || '').replace(/\r\n?/g,'\n').split('\n');
  let out = '', i = 0;

  const isTableSep = s => /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(s) && s.includes('-');
  const cells = s => s.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c => inline(c.trim()));

  while(i < lines.length){
    const raw = lines[i], line = raw.trim();

    // ligne vide
    if(!line){ i++; continue; }

    // bloc de code
    if(/^```/.test(line)){
      const buf = []; i++;
      while(i < lines.length && !/^```/.test(lines[i].trim())) buf.push(lines[i++]);
      i++;
      out += '<pre><code>'+esc(buf.join('\n'))+'</code></pre>';
      continue;
    }

    // séparateur
    if(/^(\*\s*){3,}$|^(-\s*){3,}$|^(_\s*){3,}$/.test(line)){ out += '<hr>'; i++; continue; }

    // titre
    let m = line.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      const lvl = Math.min(m[1].length, 4);
      out += '<h'+lvl+'>'+inline(m[2].replace(/\s*#+\s*$/,''))+'</h'+lvl+'>';
      i++; continue;
    }

    // tableau
    if(line.includes('|') && i+1 < lines.length && isTableSep(lines[i+1])){
      const head = cells(line); i += 2;
      let body = '';
      while(i < lines.length && lines[i].includes('|') && lines[i].trim()){
        body += '<tr>' + cells(lines[i]).map(c => '<td>'+c+'</td>').join('') + '</tr>';
        i++;
      }
      out += '<div class="table-wrap"><table><thead><tr>'
           + head.map(c => '<th>'+c+'</th>').join('')
           + '</tr></thead><tbody>'+body+'</tbody></table></div>';
      continue;
    }

    // citation
    if(/^>\s?/.test(line)){
      const buf = [];
      while(i < lines.length && /^\s*>\s?/.test(lines[i])){
        buf.push(lines[i].replace(/^\s*>\s?/,'')); i++;
      }
      out += '<blockquote>'+md(buf.join('\n'))+'</blockquote>';
      continue;
    }

    // listes (à puces ou numérotées, un niveau d'imbrication)
    const bullet = /^(\s*)([-*+])\s+(.*)$/, numbered = /^(\s*)(\d+)[.)]\s+(.*)$/;
    if(bullet.test(raw) || numbered.test(raw)){
      const ordered = !bullet.test(raw);
      const re = ordered ? numbered : bullet;
      let html = '', openSub = false;
      const baseIndent = raw.match(re)[1].length;

      while(i < lines.length){
        const r = lines[i];
        const mm = r.match(bullet) || r.match(numbered);
        if(!mm){
          // ligne de continuation rattachée à la puce précédente
          if(r.trim() && /^\s{2,}/.test(r) && html){ html = html.replace(/<\/li>$/, ' '+inline(r.trim())+'</li>'); i++; continue; }
          break;
        }
        const ind = mm[1].length, txt = mm[3];
        if(ind > baseIndent){
          if(!openSub){ html += '<ul>'; openSub = true; }
          html += '<li>'+inline(txt)+'</li>';
        }else{
          if(openSub){ html += '</ul>'; openSub = false; }
          html += '<li>'+inline(txt)+'</li>';
        }
        i++;
      }
      if(openSub) html += '</ul>';
      out += ordered ? '<ol>'+html+'</ol>' : '<ul>'+html+'</ul>';
      continue;
    }

    // paragraphe
    const buf = [];
    while(i < lines.length && lines[i].trim()
          && !/^(#{1,6}\s|>|```)/.test(lines[i].trim())
          && !bullet.test(lines[i]) && !numbered.test(lines[i])){
      buf.push(lines[i].trim()); i++;
    }
    if(buf.length) out += '<p>'+inline(buf.join(' '))+'</p>';
  }
  return out;
}

function fmtDate(ms){
  if(!ms) return '';
  try{
    return new Date(ms).toLocaleDateString('fr-FR',
      { day:'2-digit', month:'short', year:'numeric', timeZone:'Indian/Reunion' });
  }catch(_){ return ''; }
}
