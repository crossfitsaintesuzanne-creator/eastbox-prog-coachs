<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14233c">
<meta name="robots" content="noindex, nofollow">
<title>EASTBOX · TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   EASTBOX — MODE DIFFUSION TV (écran de salle)
   Fichier séparé d'index.html (demande de Ron, 2026-08-24) : l'appli coachs
   ne doit jamais être affectée par ce qui tourne ici. Aucun fichier partagé,
   aucune dépendance externe — même principe qu'index.html (tout en un seul
   fichier, déployable tel quel sur GitHub Pages à côté de l'autre).
   =========================================================================== */
:root{
  --navy:#14233c; --navy-2:#1b2e4d; --navy-3:#24395e;
  --orange:#ea8d49; --orange-d:#c9752f;
  --ink:#eef2f8; --muted:#8ea0bd; --line:rgba(255,255,255,.09);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--navy); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55; min-height:100dvh;
}
h1,h2,h3,h4{margin:0;font-weight:700}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;font-size:16px}
.hide{display:none !important}

/* ---------- Écran connexion (identique à index.html) ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card-login{
  width:100%;max-width:380px;background:var(--navy-2);
  border:1px solid var(--line);border-radius:20px;padding:30px 24px;
  box-shadow:0 22px 60px rgba(0,0,0,.42);
}
.logo{display:flex;justify-content:center}
.logo img{height:64px;width:auto;display:block}
.logo-sub{
  text-align:center;color:var(--muted);font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;margin:8px 0 26px;
}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 7px;font-weight:600}
.field{margin-bottom:16px}
input[type=text],input[type=password]{
  width:100%;padding:13px 14px;border-radius:11px;
  background:var(--navy);border:1.5px solid var(--line);color:var(--ink);
  outline:none;transition:border-color .15s;
}
input:focus{border-color:var(--orange)}
.btn{
  width:100%;padding:14px;border-radius:11px;
  background:var(--orange);color:#10192b;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;font-size:13px;
  transition:transform .1s,background .15s;
}
.btn:active{transform:scale(.98);background:var(--orange-d)}
.btn[disabled]{opacity:.55;pointer-events:none}
.msg{
  margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13px;
  background:rgba(224,102,102,.12);border:1px solid rgba(224,102,102,.3);color:#f4b4b4;
}

/* ---------- Chargement ---------- */
.spin{
  width:26px;height:26px;margin:44px auto;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--orange);
  animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Rendu markdown minimal (sous-ensemble de index.html) ---------- */
.doc h1,.doc h2{font-family:'Bebas Neue',sans-serif;font-weight:400;color:var(--orange);margin:10px 0 8px}
.doc h3{letter-spacing:.13em;text-transform:uppercase;color:var(--ink);margin:14px 0 6px}
.doc h4{color:var(--muted);margin:10px 0 5px;letter-spacing:.06em;text-transform:uppercase}
.doc > :first-child{margin-top:0}
.doc p{margin:0 0 9px}
.doc ul,.doc ol{margin:0 0 10px;padding-left:20px}
.doc li{margin-bottom:4px}
.doc li::marker{color:var(--orange)}
.doc strong{color:#fff}
.doc em{color:var(--muted);font-style:italic}
.doc hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.doc blockquote{
  margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--orange);
  background:rgba(255,255,255,.03);color:var(--muted);
}
.doc a{color:var(--orange)}
.doc table{border-collapse:collapse;width:100%;font-size:.9em}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;text-align:left}

/* ---------- Mode diffusion TV ---------- */
.tv-screen{min-height:100dvh;overflow-y:auto;padding:28px 40px}
.tv-head{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.tv-logo{height:48px;width:auto;display:block}
.tv-headdate{
  flex:1;font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;text-transform:uppercase;
  font-size:clamp(22px,2.6vw,36px);color:var(--ink);
}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:26px;align-items:start}
.tv-card{
  background:var(--navy-2);border:1px solid var(--line);border-radius:18px;
  padding:28px 30px;border-top:5px solid var(--c,var(--orange));
}
.tv-pill{
  display:inline-block;padding:6px 16px;border-radius:999px;margin-bottom:12px;
  font-size:clamp(13px,1.1vw,16px);font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  background:var(--c,var(--orange));color:#10192b;
}
.tv-day{
  font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;text-transform:uppercase;
  font-size:clamp(24px,2.8vw,38px);color:var(--ink);line-height:1.05;
}
.tv-card-date{display:block;font-size:clamp(13px,1.1vw,16px);color:var(--muted);margin:2px 0 18px}
.tv-empty{text-align:center;color:var(--muted);padding:100px 20px;font-size:clamp(18px,2.2vw,28px)}
.tv-card .doc h3{font-size:clamp(15px,1.5vw,20px)}
.tv-card .doc h4{font-size:clamp(13px,1.2vw,17px)}
.tv-card .doc p,.tv-card .doc li{font-size:clamp(14px,1.4vw,19px);line-height:1.5}
.tv-card .doc blockquote{font-size:clamp(12px,1.1vw,15px)}
</style>
</head>

<!-- ============================ MODE TV ============================ -->
<div id="tv" class="hide"></div>

<script>
/* ===========================================================================
   CONFIGURATION — doit rester identique à la constante API d'index.html.
   =========================================================================== */
const API = 'https://script.google.com/macros/s/AKfycbyiug_GyeZa-lgbbIB7TQZ_3_p8pIpRwxF0ICYuWUXQ5NbKcj6pH3dMsVBspScEYB9pMg/exec';

const S = { token:null, user:null, items:[], todayCache:{} };
const $  = s => document.querySelector(s);

async function api(payload){
  const r = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload),
    redirect:'follow'
  });
  if(!r.ok) throw new Error('Serveur injoignable ('+r.status+')');
  const data = await r.json();
  if(data.logout){ logout('Session expirée, reconnecte-toi.'); throw new Error('Session expirée'); }
  return data;
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), msg = $('#loginMsg');
  btn.disabled = true; btn.textContent = 'Connexion…'; msg.classList.add('hide');
  try{
    const res = await api({ action:'login', login:$('#u').value, pass:$('#p').value });
    if(!res.ok) throw new Error(res.error || 'Échec de la connexion');
    S.token = res.token; S.user = res.user;
    try{ localStorage.setItem('eb_tv', JSON.stringify({t:res.token,u:res.user})); }catch(_){}
    $('#p').value = '';
    startTV();
  }catch(err){
    msg.textContent = err.message; msg.classList.remove('hide');
  }finally{
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
});

function logout(note){
  try{ localStorage.removeItem('eb_tv'); }catch(_){}
  S.token = S.user = null;
  clearInterval(S.tvInterval);
  $('#tv').classList.add('hide');
  $('#login').classList.remove('hide');
  if(note){ const m = $('#loginMsg'); m.textContent = note; m.classList.remove('hide'); }
}

function restore(){
  try{
    const raw = localStorage.getItem('eb_tv');
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s.t || !s.u) return false;
    S.token = s.t; S.user = s.u;
    return true;
  }catch(_){ return false; }
}

/* ===========================================================================
   MODE DIFFUSION — même logique que l'écran « Aujourd'hui » d'index.html,
   copiée ici volontairement (pas de fichier JS partagé) pour que les deux
   fichiers restent totalement indépendants.
   =========================================================================== */
async function startTV(){
  $('#login').classList.add('hide');
  $('#tv').classList.remove('hide');
  $('#tv').innerHTML = '<div class="tv-screen"><div class="spin" style="margin-top:140px"></div></div>';
  await refreshTV();
  clearInterval(S.tvInterval);
  S.tvInterval = setInterval(refreshTV, 10*60*1000); // 10 min, aligné sur le cache serveur
}

async function refreshTV(){
  try{
    const res = await api({ action:'list', token:S.token, refresh:1 });
    if(!res.ok) throw new Error(res.error);
    S.items = res.items || [];
  }catch(err){
    $('#tv').innerHTML = '<div class="tv-screen"><div class="tv-empty">⚠️ '+esc(err.message)+'</div></div>';
    return;
  }
  renderTV();
}

async function computeTodayCards(){
  const discs = S.user.access.filter(a => a.key !== 'kids');
  if(!discs.length) return [];
  const now = new Date();
  const { week:targetWeek, year:targetYear } = isoWeekYear(now);
  function pickForWeek(items){
    return items.find(i => i.week === targetWeek && i.year === targetYear) || items[0];
  }
  const cards = [];
  for(const d of discs){
    const list = S.items.filter(i => i.discipline === d.key);
    if(!list.length) continue;
    const card = await loadTodayCard(d, pickForWeek(list), now);
    if(card) cards.push(card);
  }
  return cards;
}

async function loadTodayCard(disc, item, now){
  let content = S.todayCache[item.id];
  if(content === undefined){
    try{
      const res = await api({ action:'file', token:S.token, id:item.id });
      content = res.ok ? res.content : null;
    }catch(e){ content = null; }
    S.todayCache[item.id] = content;
  }
  if(!content) return null;
  const days = splitDays(content);
  const idx = nearestDatedIndex(days, now);
  if(idx < 0) return null;
  if(!days[idx].date || !sameCalendarDay(days[idx].date, now)) return null;
  return { disc, item, days, idx, label: disc.label };
}

function nearestDatedIndex(days, now){
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let best = -1, bestDiff = Infinity;
  days.forEach((d,i) => {
    if(!d.date) return;
    const diff = Math.abs(d.date.getTime() - today.getTime());
    if(diff < bestDiff){ bestDiff = diff; best = i; }
  });
  return best;
}
function sameCalendarDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function fmtNomDate(d){
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function isoWeekYear(d){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (dt.getUTCDay() + 6) % 7;
  dt.setUTCDate(dt.getUTCDate() - day + 3);
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
  const fdDay = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - fdDay + 3);
  const week = 1 + Math.round((dt - firstThursday) / (7*86400000));
  return { week, year: dt.getUTCFullYear() };
}

/* ===========================================================================
   DÉCOUPAGE PAR JOUR + RENDU MARKDOWN — copié à l'identique d'index.html
   (mêmes fonctions, même comportement, voir NOMENCLATURE_MD.md).
   =========================================================================== */
const DAYS = [
  ['MONDAY','LUNDI'],['TUESDAY','MARDI'],['WEDNESDAY','MERCREDI'],
  ['THURSDAY','JEUDI'],['FRIDAY','VENDREDI'],['SATURDAY','SAMEDI'],['SUNDAY','DIMANCHE']
];
const DAY_RE = new RegExp('\\b(' + DAYS.flat().join('|') + ')\\b', 'i');
const NOM_DATE_RE = /(\d{2})\/(\d{2})\/(\d{4})/;

function parseNomDate(s){
  const m = s.match(NOM_DATE_RE);
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}

function splitDays(text){
  const lines = (text || '').split(/\r?\n/);
  const cuts = [];
  lines.forEach((ln, i) => {
    const t = ln.trim();
    const isHeading = /^##\s+/.test(t);
    const isBoldLine = /^\*\*[^*]{1,40}\*\*:?\s*$/.test(t);
    if(!isHeading && !isBoldLine) return;
    const m = t.match(DAY_RE);
    if(m) cuts.push({ i:i, label:normDay(m[1]), date:parseNomDate(t) });
  });
  if(cuts.length < 1) return [{ label:'Tout', body:text || '', date:null }];

  const days = cuts.map((c, k) => ({
    label: c.label,
    date:  c.date,
    body:  lines.slice(c.i, k+1 < cuts.length ? cuts[k+1].i : lines.length).join('\n')
  }));
  return days
    .map((d, i) => ({ d, i }))
    .sort((a, b) => {
      if(a.d.date && b.d.date) return a.d.date - b.d.date;
      if(a.d.date) return -1;
      if(b.d.date) return 1;
      return a.i - b.i;
    })
    .map(x => x.d);
}

function normDay(w){ return w.toUpperCase(); }

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function inline(s){
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, (_,c)=>'<code>'+c+'</code>');
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">');
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  t = t.replace(/(^|[^_\w])_([^_\n]+)_(?![\w_])/g, '$1<em>$2</em>');
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return t;
}

function md(src){
  const lines = String(src || '').replace(/\r\n?/g,'\n').split('\n');
  let out = '', i = 0;

  const isTableSep = s => /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(s) && s.includes('-');
  const cells = s => s.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c => inline(c.trim()));

  while(i < lines.length){
    const raw = lines[i], line = raw.trim();
    if(!line){ i++; continue; }

    if(/^```/.test(line)){
      const buf = []; i++;
      while(i < lines.length && !/^```/.test(lines[i].trim())) buf.push(lines[i++]);
      i++;
      out += '<pre><code>'+esc(buf.join('\n'))+'</code></pre>';
      continue;
    }

    if(/^(\*\s*){3,}$|^(-\s*){3,}$|^(_\s*){3,}$/.test(line)){ out += '<hr>'; i++; continue; }

    let m = line.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      const lvl = Math.min(m[1].length, 4);
      out += '<h'+lvl+'>'+inline(m[2].replace(/\s*#+\s*$/,''))+'</h'+lvl+'>';
      i++; continue;
    }

    if(line.includes('|') && i+1 < lines.length && isTableSep(lines[i+1])){
      const head = cells(line); i += 2;
      let body = '';
      while(i < lines.length && lines[i].includes('|') && lines[i].trim()){
        body += '<tr>' + cells(lines[i]).map(c => '<td>'+c+'</td>').join('') + '</tr>';
        i++;
      }
      out += '<div class="table-wrap"><table><thead><tr>'
           + head.map(c => '<th>'+c+'</th>').join('')
           + '</tr></thead><tbody>'+body+'</tbody></table></div>';
      continue;
    }

    if(/^>\s?/.test(line)){
      const buf = [];
      while(i < lines.length && /^\s*>\s?/.test(lines[i])){
        buf.push(lines[i].replace(/^\s*>\s?/,'')); i++;
      }
      out += '<blockquote>'+md(buf.join('\n'))+'</blockquote>';
      continue;
    }

    const bullet = /^(\s*)([-*+])\s+(.*)$/, numbered = /^(\s*)(\d+)[.)]\s+(.*)$/;
    if(bullet.test(raw) || numbered.test(raw)){
      const ordered = !bullet.test(raw);
      const re = ordered ? numbered : bullet;
      let html = '', openSub = false;
      const baseIndent = raw.match(re)[1].length;

      while(i < lines.length){
        const r = lines[i];
        const mm = r.match(bullet) || r.match(numbered);
        if(!mm){
          if(r.trim() && /^\s{2,}/.test(r) && html){ html = html.replace(/<\/li>$/, ' '+inline(r.trim())+'</li>'); i++; continue; }
          break;
        }
        const ind = mm[1].length, txt = mm[3];
        if(ind > baseIndent){
          if(!openSub){ html += '<ul>'; openSub = true; }
          html += '<li>'+inline(txt)+'</li>';
        }else{
          if(openSub){ html += '</ul>'; openSub = false; }
          html += '<li>'+inline(txt)+'</li>';
        }
        i++;
      }
      if(openSub) html += '</ul>';
      out += ordered ? '<ol>'+html+'</ol>' : '<ul>'+html+'</ul>';
      continue;
    }

    const buf = [];
    while(i < lines.length && lines[i].trim()
          && !/^(#{1,6}\s|>|```)/.test(lines[i].trim())
          && !bullet.test(lines[i]) && !numbered.test(lines[i])){
      buf.push(lines[i].trim()); i++;
    }
    if(buf.length) out += '<p>'+inline(buf.join(' '))+'</p>';
  }
  return out;
}
