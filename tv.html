<style>
/* ===========================================================================
   EASTBOX — MODE DIFFUSION TV (écran de salle)
   Fichier séparé d'index.html (demande de Ron, 2026-08-24) : l'appli coachs
   ne doit jamais être affectée par ce qui tourne ici. Aucun fichier partagé,
   aucune dépendance externe.
   v2 (2026-08-25) : un écran plein par discipline (rotation auto si
   plusieurs), rendu structuré et coloré façon affiches JPEG plutôt que du
   markdown générique — voir renderWodSection().
   =========================================================================== */
:root{
  --navy:#14233c; --navy-2:#1b2e4d; --navy-3:#24395e;
  --orange:#ea8d49; --orange-d:#c9752f; --orange2:#fcaa41;
  --cyan:#38ccf5; --cyan-light:#c0f3ff; --red:#ec3d3b; --sand:#ffd385;
  --ink:#eef2f8; --muted:#8ea0bd; --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--navy); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  line-height:1.5; height:100dvh; overflow:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:700}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;font-size:16px}
.hide{display:none !important}

/* ---------- Écran connexion ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px;overflow:auto}
.card-login{
  width:100%;max-width:380px;background:var(--navy-2);
  border:1px solid var(--line);border-radius:20px;padding:30px 24px;
  box-shadow:0 22px 60px rgba(0,0,0,.42);
}
.logo{display:flex;justify-content:center}
.logo img{height:64px;width:auto;display:block}
.logo-sub{
  text-align:center;color:var(--muted);font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;margin:8px 0 26px;
}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 7px;font-weight:600}
.field{margin-bottom:16px}
input[type=text],input[type=password]{
  width:100%;padding:13px 14px;border-radius:11px;
  background:var(--navy);border:1.5px solid var(--line);color:var(--ink);
  outline:none;transition:border-color .15s;
}
input:focus{border-color:var(--orange)}
.btn{
  width:100%;padding:14px;border-radius:11px;
  background:var(--orange);color:#10192b;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;font-size:13px;
  transition:transform .1s,background .15s;
}
.btn:active{transform:scale(.98);background:var(--orange-d)}
.btn[disabled]{opacity:.55;pointer-events:none}
.msg{
  margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13px;
  background:rgba(224,102,102,.12);border:1px solid rgba(224,102,102,.3);color:#f4b4b4;
}

/* ---------- Chargement ---------- */
.spin{
  width:26px;height:26px;margin:44px auto;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--orange);
  animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Mode diffusion TV ---------- */
.tv-screen{height:100dvh;display:flex;flex-direction:column;padding:22px 40px 26px;position:relative}
/* Filigrane phoenix EastBox en fond, façon affiches JPEG (demande de Ron,
   2026-08-25) — mêmes réglages que TEMPLATE_CF_VERTICAL.html : centré,
   opacité faible, sous le contenu. */
.tv-watermark{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:0;overflow:hidden;
}
.tv-watermark img{width:60%;max-width:780px;opacity:.16;object-fit:contain}
.tv-head{display:flex;align-items:center;gap:18px;flex:0 0 auto;margin-bottom:10px;position:relative;z-index:1}
.tv-logo{height:38px;width:auto;display:block}
.tv-headdate{
  flex:1;font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;text-transform:uppercase;
  font-size:22px;color:var(--muted);
}
.tv-dots{display:flex;gap:8px}
.tv-dot{width:12px;height:12px;border-radius:50%;background:var(--line);padding:0;flex:0 0 auto}
.tv-dot.on{background:var(--c,var(--orange))}
.tv-empty{margin:auto;text-align:center;color:var(--muted);font-size:28px;position:relative;z-index:1}

.tv-slide{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
.tv-slide-top{flex:0 0 auto;display:flex;align-items:baseline;gap:16px;margin-bottom:10px}
.tv-pill{
  display:inline-block;padding:.35em 1em;border-radius:999px;
  font-size:20px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  background:var(--c,var(--orange));color:#10192b;
}
.tv-slide-body{flex:1;min-height:0;overflow:hidden}
.doc-fallback{font-size:26px}

/* ---------- Rendu structuré des séances (façon affiches JPEG) ---------- */
.wod-grid{display:grid;grid-template-columns:1fr;gap:1.2em;height:100%}
.wod-grid.has-2col{grid-template-columns:1fr 1.15fr;gap:2.2em}
.wod-col{min-width:0;overflow:hidden}

/* ---------- Écran vertical (2026-08-30, demande de Ron) ----------
   Le même fichier sert les deux orientations : un seul upload, une seule
   session, une seule version. Rien à changer côté serveur.

   ⚠️ Les 2 colonnes ne sont PAS simplement empilées. fitOne() mesure la
   hauteur DISPONIBLE de chaque .wod-col — hauteur que la grille lui impose en
   l'étirant. Avec des lignes en `auto`, cette hauteur suivrait le contenu :
   le rapport contenu/disponible vaudrait toujours ~1 et la boucle
   descendrait jusqu'à la taille minimale, texte minuscule sur un écran à
   moitié vide. On transpose donc les colonnes en LIGNES proportionnelles
   (mêmes poids 1 / 1.15) : chaque bloc reçoit un budget de hauteur défini,
   et le moteur d'ajustement fonctionne exactement comme en paysage.

   Un écran 1080×1920 offre plus de hauteur utile qu'un 1920×1080 : à contenu
   égal, le texte est plus gros qu'en paysage, pas plus petit. */
@media (orientation: portrait){
  .tv-screen{padding:30px 34px 34px}
  .wod-grid.has-2col{grid-template-columns:1fr;grid-template-rows:1fr 1.15fr;gap:1.6em}
  .tv-head{gap:14px;margin-bottom:14px}
  .tv-slide-top{margin-bottom:14px}
}
/* Volontairement pas étiré (contrairement à .wod-col, qui l'est par la
   grille) : sa hauteur naturelle sert de mesure « contenu réel » à fitOne(),
   voir le commentaire au-dessus de cette fonction. */
/* Espacements resserrés (2026-08-25, retour de Ron : le texte de gauche ne
   grossissait pas comme celui de droite) — .wsec avait une marge ET le gap
   du parent (double espacement redondant), et les cartes/notes avaient du
   remplissage généreux. En comprimant ce « chrome » non-texte, le budget de
   hauteur restant pour le texte augmente, donc fitOne() peut converger sur
   une taille de police plus grande pour un même contenu. */
.wod-col-inner{display:flex;flex-direction:column;gap:.6em}
.wsec-head{display:flex;align-items:center;gap:.5em;margin-bottom:.22em;flex-wrap:wrap}
.wtag{font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.12em .5em;border-radius:8px;font-size:.62em;white-space:nowrap}
.wsec.a .wtag{background:var(--orange2);color:var(--navy)}
.wsec.b .wtag{background:var(--cyan);color:var(--navy)}
.wsec.c .wtag{background:var(--red);color:#fff}
.wtitle{font-weight:900;text-transform:uppercase;letter-spacing:.02em;color:#fff;font-size:.62em}
.wcard{background:rgba(255,255,255,.05);border:1px solid rgba(56,204,245,.22);border-radius:12px;padding:.35em .6em}
.wrow{display:flex;align-items:baseline;gap:.5em;padding:.08em 0;font-size:.56em}
.wdot{width:.42em;height:.42em;border-radius:50%;background:var(--orange2);flex:0 0 auto;margin-top:.35em}
.wsec.b .wdot{background:var(--cyan)}
.wsec.c .wdot{background:var(--red)}
.wnum{font-weight:900;color:var(--orange2);min-width:1.5em;flex:0 0 auto}
.wsec.b .wnum{color:var(--cyan)}
.wsec.c .wnum{color:var(--red)}
.wtxt{color:#fff;font-weight:600;line-height:1.15}
.wtxt em{color:var(--cyan-light);font-style:italic;font-weight:400;opacity:.9}
.wlbl{font-size:.5em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin:.35em 0 .18em}
.wcard > .wlbl:first-child{margin-top:0}
</style>
</head>

  const r = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload),
    redirect:'follow'
  });
  if(!r.ok) throw new Error('Serveur injoignable ('+r.status+')');
  const data = await r.json();
  if(data.logout){ logout('Session expirée, reconnecte-toi.'); throw new Error('Session expirée'); }
  return data;
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), msg = $('#loginMsg');
  btn.disabled = true; btn.textContent = 'Connexion…'; msg.classList.add('hide');
  try{
    // Identifiant laissé vide = ce qui est saisi est une clé d'écran, pas un
    // mot de passe. Permet de démarrer un écran sans toucher à son favori.
    const saisi = $('#p').value.trim();
    const res = $('#u').value.trim()
      ? await api({ action:'login', login:$('#u').value, pass:$('#p').value })
      : await api({ action:'tvKey', key:saisi });
    if(!res.ok) throw new Error(res.error || 'Échec de la connexion');
    S.token = res.token; S.user = res.user;
    try{ localStorage.setItem('eb_tv', JSON.stringify({t:res.token,u:res.user})); }catch(_){}
    $('#p').value = '';
    startTV();
  }catch(err){
    msg.textContent = err.message; msg.classList.remove('hide');
  }finally{
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
});

function logout(note){
  try{ localStorage.removeItem('eb_tv'); }catch(_){}
  S.token = S.user = null;
  clearInterval(S.tvInterval); clearInterval(S.rotateInterval);
  $('#tv').classList.add('hide');
  $('#login').classList.remove('hide');
  if(note){ const m = $('#loginMsg'); m.textContent = note; m.classList.remove('hide'); }
}

function restore(){
  try{
    const raw = localStorage.getItem('eb_tv');
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s.t || !s.u) return false;
    S.token = s.t; S.user = s.u;
    return true;
  }catch(_){ return false; }
}

/* ===========================================================================
   MODE DIFFUSION — un écran plein par discipline, rotation automatique.
   =========================================================================== */
async function startTV(){
  $('#login').classList.add('hide');
  $('#tv').classList.remove('hide');
  $('#tv').innerHTML = '<div class="tv-screen"><div class="spin" style="margin:auto"></div></div>';
  await refreshTV();
  clearInterval(S.tvInterval);
  S.tvInterval = setInterval(refreshTV, 10*60*1000); // 10 min, aligné sur le cache serveur
}

async function refreshTV(){
  try{
    const res = await api({ action:'list', token:S.token, refresh:1 });
    if(!res.ok) throw new Error(res.error);
    S.items = res.items || [];
  }catch(err){
    $('#tv').innerHTML = '<div class="tv-screen"><div class="tv-empty">⚠️ '+esc(err.message)+'</div></div>';
    return;
  }
  // Le rendu doit être protégé lui aussi : avant, une exception ici (fichier
  // .md inattendu, discipline mal formée…) rejetait la promesse sans jamais
  // remplacer le spinner. L'écran de la salle tournait dans le vide sans rien
  // dire. Un écran muet est le pire cas : maintenant il affiche ce qui cloche.
  try{
    S.tvCards = await computeTodayCards();
  }catch(err){
    $('#tv').innerHTML = '<div class="tv-screen"><div class="tv-empty">⚠️ Affichage impossible<br>'
                       + '<span style="font-size:.6em">'+esc(String(err && err.message || err))+'</span></div></div>';
    return;
  }
  if(S.tvIdx >= S.tvCards.length) S.tvIdx = 0;
  renderSlide();
  // Rien à afficher ALORS QUE des lectures ont échoué : ce n'est pas une
  // journée sans séance, c'est une panne. On réessaie sans attendre les
  // 10 minutes du cycle normal.
  if(!S.tvCards.length && (S.tvCards.echecs || []).length){
    clearTimeout(S.retryTimer);
    S.retryTimer = setTimeout(refreshTV, 30000);
  }
  clearInterval(S.rotateInterval);
  // Pas de rotation si une discipline a été choisie à la main (voir pickSlide) :
  // elle reste affichée tant que Ron ne clique pas sur un autre point — demande
  // de Ron, 2026-08-25.
  if(S.tvCards.length > 1 && !S.tvManual){
    S.rotateInterval = setInterval(nextSlide, ROTATE_MS);
  }
}

function nextSlide(){
  if(!S.tvCards.length) return;
  S.tvIdx = (S.tvIdx + 1) % S.tvCards.length;
  renderSlide();
}

/** Choix manuel d'une discipline (clic sur un point) : arrête la rotation
 *  automatique, reste sur ce choix jusqu'au prochain clic. */
function pickSlide(i){
  if(i < 0 || i >= S.tvCards.length) return;
  S.tvIdx = i;
  S.tvManual = true;
  clearInterval(S.rotateInterval);
  renderSlide();
}

/** Disciplines affichées sur l'écran TV pour l'instant (demande de Ron,
 *  2026-08-25) : seules CrossFit et Hyrox ont un affichage abouti — les
 *  autres restent sur le repli générique, pas encore validées pour le mur
 *  de salle. Liste à élargir ici quand une nouvelle discipline sera prête,
 *  rien d'autre à toucher. */
const TV_DISCIPLINES = ['crossfit', 'hyrox'];

async function computeTodayCards(){
  const discs = S.user.access.filter(a => TV_DISCIPLINES.includes(a.key));
  if(!discs.length) return [];
  const now = new Date();
  const { week:targetWeek, year:targetYear } = isoWeekYear(now);
  function pickForWeek(items){
    return items.find(i => i.week === targetWeek && i.year === targetYear) || items[0];
  }
  const cards = [];
  const echecs = [];   // porte aussi .raison : le message de la 1re erreur
  for(const d of discs){
    const list = S.items.filter(i => i.discipline === d.key);
    if(!list.length) continue;
    // Une discipline dont le fichier est illisible ne doit pas faire tomber
    // les autres : on la saute, l'écran affiche ce qui reste.
    let card = null;
    try{ card = await loadTodayCard(d, pickForWeek(list), now); }
    catch(e){
      // On garde le message de la 1re erreur : sur un écran sans console ni
      // clavier, c'est la seule façon de savoir POURQUOI la lecture échoue.
      echecs.push(d.label);
      if(!echecs.raison) echecs.raison = String((e && e.message) || e);
      console.warn('Discipline illisible : ' + d.key, e);
    }
    if(card) cards.push(card);
  }
  cards.echecs = echecs;   // porté avec le résultat, lu par renderSlide()
  return cards;
}

async function loadTodayCard(disc, item, now){
  let content = S.todayCache[item.id];
  if(content === undefined){
    // Deux corrections ici (2026-09-02), toutes deux antérieures à l'affichage
    // vertical et responsables du « Pas de séance programmée aujourd'hui »
    // affiché à tort sur le mur de la salle :
    //
    // 1. L'échec de lecture était avalé (`content = null`) et devenait
    //    indiscernable d'une vraie journée sans séance. On le remonte
    //    désormais à l'appelant, qui affiche « momentanément illisible ».
    // 2. Le résultat était mis en cache MÊME en cas d'échec : une panne
    //    réseau d'une seconde condamnait l'écran jusqu'au rechargement
    //    complet, les rafraîchissements suivants relisant le null en cache.
    //    On ne met en cache que les lectures réussies.
    const res = await api({ action:'file', token:S.token, id:item.id });
    if(!res.ok) throw new Error(res.error || 'Fichier illisible');
    content = res.content;
    if(content) S.todayCache[item.id] = content;
  }
  if(!content) return null;   // fichier vide : vraie absence de séance
  const days = splitDays(content);
  const idx = nearestDatedIndex(days, now);
  if(idx < 0) return null;
  if(!days[idx].date || !sameCalendarDay(days[idx].date, now)) return null;
  return { disc, item, days, idx, label: disc.label };
}

function nearestDatedIndex(days, now){
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let best = -1, bestDiff = Infinity;
  days.forEach((d,i) => {
    if(!d.date) return;
    const diff = Math.abs(d.date.getTime() - today.getTime());
    if(diff < bestDiff){ bestDiff = diff; best = i; }
  });
  return best;
}
function sameCalendarDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function fmtNomDate(d){
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function isoWeekYear(d){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (dt.getUTCDay() + 6) % 7;
  dt.setUTCDate(dt.getUTCDate() - day + 3);
  const firstThursday = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
  const fdDay = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - fdDay + 3);
  const week = 1 + Math.round((dt - firstThursday) / (7*86400000));
  return { week, year: dt.getUTCFullYear() };
}

  document.fonts.ready.then(() => {
    let fait = false;
    const lancer = () => { if(fait) return; fait = true; fitColumns(); };
    requestAnimationFrame(lancer);

  });
}

/** Réduit le font-size du conteneur (tout est en em à l'intérieur, voir CSS
 *  wsec/wrow/etc.) jusqu'à ce que le contenu tienne sans scroll. Même
 *  principe que le script des affiches JPEG (scripts/generate_wods*.py),
 *  adapté au direct, MAIS bidirectionnel : chaque colonne (warmup/routine/
 *  skill à gauche, workout à droite) est ajustée indépendamment pour remplir
 *  ~90% de sa hauteur disponible — une colonne courte grossit son texte au
 *  lieu de laisser du vide, une colonne dense rétrécit pour ne pas déborder.
 *  Lisible de loin, demande de Ron le 2026-08-25. */
/** Harmonise la taille du texte entre les 2 colonnes (demande de Ron,
 *  2026-08-25) : chaque colonne calcule d'abord sa propre taille d'équilibre
 *  (remplir 90-95% de sa hauteur, voir fitOne), puis la PLUS PETITE des deux
 *  est appliquée aux deux — même police des deux côtés, et la colonne la
 *  plus dense (celle qui a fixé cette taille) reste à 90-95%. La colonne la
 *  moins dense aura un peu de vide en dessous : compromis nécessaire, on ne
 *  peut pas avoir une police commune ET les deux colonnes à 90-95% quand les
 *  volumes de texte sont très différents (ex. Warm-up court vs Conditioning
 *  à 5 blocs AMRAP/Rest). Une seule colonne détectée : pas d'harmonisation
 *  à faire, elle vise directement 90-95% comme avant. */
function fitColumns(){
  const cols = document.querySelectorAll('#tvBody .wod-col');
  if(cols.length <= 1){
    cols.forEach(col => fitOne(col, 0.90, 14, 140));
    return;
  }
  const sizes = Array.from(cols).map(col => fitOne(col, 0.90, 14, 140));
  const shared = Math.min(...sizes);
  cols.forEach(col => { col.style.fontSize = shared + 'px'; });
}

/** el = .wod-col (étiré par la grille : sa hauteur = budget disponible, fixe,
 *  quel que soit le contenu — align-items:stretch). Mesurer scrollHeight
 *  dessus donnerait toujours ~la même valeur que clientHeight, quel que soit
 *  le texte : il faut la hauteur RÉELLE du contenu, mesurée sur le wrapper
 *  interne (.wod-col-inner) qui, lui, n'est pas étiré et suit son contenu.
 *  Renvoie la taille (px) trouvée — utilisé par fitColumns() pour harmoniser. */
function fitOne(el, target, sMin, sMax){
  const avail = el.clientHeight;
  const inner = el.querySelector('.wod-col-inner');
  if(!avail || !inner) return sMin;
  let s = 32;
  el.style.fontSize = s + 'px';
  const lo = target - 0.04, hi = target + 0.05;
  let guard = 0;
  while(guard < 200){
    const ratio = inner.scrollHeight / avail;
    if(ratio > 0.98) s -= 1;
    else if(ratio < lo) s += 1;
    else if(ratio > hi) s -= 1;
    else break;
    s = Math.max(sMin, Math.min(sMax, s));
    el.style.fontSize = s + 'px';
    if(s <= sMin || s >= sMax) break;
    guard++;
  }
  return s;
}

/* ===========================================================================
   RENDU STRUCTURÉ DES SÉANCES — façon affiches JPEG (voir skills
   skill-create-image-wod-*) : un bloc coloré par section (#### du .md),
   Warm-up en orange, blocs intermédiaires en cyan, séance finale en rouge.
   Parsing tolérant : si la structure n'est pas reconnue, repli sur md().
   =========================================================================== */
function splitHeading(h){
  const m = h.match(/^(.*?)\s[-–—]\s(.*)$/);
  if(m) return { tag: m[1].trim(), title: m[2].trim() };
  return { tag: h.trim(), title: '' };
}

/** Gabarits de colonnes par discipline (demande de Ron, 2026-08-25 : « standardiser
 *  un type d'affichage en fonction de la discipline, on commence avec CrossFit »).
 *  2 formats CrossFit selon la structure réelle du jour (pas un mot-clé isolé,
 *  demande de Ron du même jour : Work on your Weaknesses / Functional
 *  Bodybuilding / Aerobic Capacity / Team ont tous UN SEUL bloc de travail
 *  après le Warm-up+Routine, contrairement aux jours à Part 1 ET Part 2) :
 *
 *  Format A (jour à 2 parties, Part 1/Skill ET Part 2 présents tous les deux) :
 *    gauche = Warm-up + Part 1/Skill · droite = Routine + Part 2/Workout.
 *  Format B (un seul bloc de travail après la prépa — pas de vraie Part 2,
 *    quel que soit son nom : Functional Bodybuilding, Aerobic Capacity,
 *    Team of X, Work on your Weaknesses...) :
 *    gauche = Warm-up + Routine · droite = ce bloc final, seul.
 *
 *  Détection : présence simultanée d'un Part 1/A ET d'un Part 2/B → Format A,
 *  sinon Format B. Un bloc qui ne matche aucun mot-clé retombe sur la règle
 *  positionnelle (1er → gauche, dernier → droite) — jamais de bloc perdu.
 *  Vérifié sur les 7 jours de la semaine 35 avant déploiement. */
function classifyDayCrossfit(tags){
  const isPart1 = t => /^part\s*1\b/i.test(t) || /^part\s*a\b/i.test(t);
  const isPart2 = t => /^part\s*2\b/i.test(t) || /^part\s*b\b/i.test(t);
  const twoPartDay = tags.some(isPart1) && tags.some(isPart2);

  return tags.map((tag, idx) => {
    if(/warm.?up/i.test(tag)) return 'left';
    if(twoPartDay){
      if(isPart1(tag) || /skill/i.test(tag)) return 'left';
      if(/routine/i.test(tag) || isPart2(tag) || /workout/i.test(tag)) return 'right';
    } else {
      if(/routine/i.test(tag)) return 'left';
    }
    return idx === tags.length - 1 ? 'right' : 'left'; // repli positionnel
  });
}

const DISPLAY_RULES = { crossfit: classifyDayCrossfit };

/** Blocs jamais affichés sur l'écran TV pour certaines disciplines (demande
 *  de Ron, 2026-08-25 : Hyrox n'affiche que la Conditioning, pas le Warm-up —
 *  la page NST regroupe les 2 mais seule la Conditioning intéresse le mur TV). */
const HIDDEN_SECTIONS = {
  hyrox: [/warm.?up/i]
};

/** Blocs jamais affichés, toutes disciplines confondues : pure commentaire
 *  de coach (ex. Gymnastics a des blocs entiers « Message du coach » /
 *  « Coaching tip — ... », CrossFit a des « Note Coach Ron : » — pas juste
 *  des lignes isolées) — même esprit que la règle « pas de commentaires »
 *  du 2026-08-25, mais au niveau du bloc entier plutôt que de la ligne. */
const ALWAYS_HIDDEN_SECTIONS = [/coaching tip/i, /message du coach/i, /note coach/i];

function renderWodSection(bodyMd, disc){
  const lines = bodyMd.split(/\r?\n/);
  const sections = [];
  let cur = null;
  lines.forEach(raw => {
    const m = raw.match(/^(#{3,4})\s+(.*)$/);
    if(m){
      if(m[1].length === 4){ cur = { heading: m[2].trim(), lines: [] }; sections.push(cur); }
      else cur = null; // ### (ex. "WOD"/"Conditioning") : pas un bloc affiché séparément
      return;
    }
    if(cur) cur.lines.push(raw);
  });
  if(!sections.length) return '<div class="doc-fallback">'+md(bodyMd)+'</div>';

  const hidden = (disc && HIDDEN_SECTIONS[disc.key]) || [];
  const visible = sections.filter(s => {
    const tag = splitHeading(s.heading).tag;
    return !ALWAYS_HIDDEN_SECTIONS.some(re => re.test(tag)) && !hidden.some(re => re.test(tag));
  });
  if(!visible.length) return '<div class="doc-fallback">'+md(bodyMd)+'</div>';

  const total = visible.length;
  const classify = disc && DISPLAY_RULES[disc.key];
  const tags = visible.map(s => splitHeading(s.heading).tag);
  const buckets = classify ? classify(tags) : tags.map((_, idx) => idx === total - 1 ? 'right' : 'left');
  const blocks = visible.map((s, idx) => ({ bucket: buckets[idx], html: renderWodBlock(s, idx, total) }));
  const left  = blocks.filter(b => b.bucket === 'left').map(b => b.html).join('');
  const right = blocks.filter(b => b.bucket === 'right').map(b => b.html).join('');
  const has2col = left && right;

  return '<div class="wod-grid'+(has2col?' has-2col':'')+'">'
       + '<div class="wod-col"><div class="wod-col-inner">'+(left || right)+'</div></div>'
       + (has2col ? '<div class="wod-col"><div class="wod-col-inner">'+right+'</div></div>' : '')
       + '</div>';
}

function renderWodBlock(sec, idx, total){
  const { tag, title } = splitHeading(sec.heading);
  const tagcls = idx === 0 ? 'a' : (idx === total - 1 ? 'c' : 'b');
  let body = '';

  // Une seule passe, dans l'ordre du document. 2026-08-25, corrections de
  // Ron : (1) commentaires/textes explicatifs jamais affichés (parasite la
  // lecture de loin) — mais Ron a précisé que la mise en forme (italique/gras)
  // ne veut RIEN dire sur le fond : « — 2 minute Rest — » est en italique
  // dans le .md mais N'EST PAS un commentaire, c'est un repère de timing.
  // Seule la LONGUEUR distingue un repère court (« 2 minute Rest », « Set 1,
  // 3, 5 ») d'une vraie explication de coach à ignorer — pas le style
  // markdown. (2) la ligne d'intro façon « 2 rounds of : » ou « For Time -
  // CAP 15' » va DANS le bloc de texte, jamais à côté du tag du titre — donc
  // plus de traitement spécial « sub », tout label court suit la même règle.
  sec.lines.forEach(raw => {
    const t = raw.trim();
    // ligne vide, ou séparateur --- entre jours (queue du dernier bloc du
    // jour dans le découpage par slice() de splitDays) : à ignorer.
    if(!t || /^-{3,}$/.test(t)) return;
    const bullet = t.match(/^[-*+]\s+(.*)$/);
    const numbered = t.match(/^(\d+)[.)]\s+(.*)$/);
    if(bullet){ body += rowHtml(bullet[1], null); return; }
    if(numbered){ body += rowHtml(numbered[2], numbered[1]); return; }

    // Ligne non-liste : retirer emphase markdown ET liens ([texte](url)) pour
    // juger la longueur du texte réellement AFFICHÉ — une ligne courte avec
    // un lien vidéo (URL longue) ne doit pas être jugée trop longue à cause
    // de l'URL brute (bug repéré par Ron, 2026-08-25, sur « General Wamup :
    // Barbell Yoga » en Weightlifting, disparu à cause de l'URL du lien).
    const italicOnly = t.match(/^\*([^*].*[^*]|[^*])\*$/);
    const boldOnly = t.match(/^\*\*(.+)\*\*$/);
    const clean = stripLinks(italicOnly ? italicOnly[1] : (boldOnly ? boldOnly[1] : t));

    if(clean.length > 40) return;           // long texte explicatif : ignoré
    // inline() et non esc() : une ligne partiellement en gras/italique
    // (« **AMRAP 5'** — 2-4-6-8-10… ») affichait ses astérisques en clair sur
    // l'écran de la salle (repéré 2026-08-30). Les cas « toute la ligne en
    // gras/italique » sont déjà dépouillés au-dessus, les autres sont rendus.
    body += '<div class="wlbl">'+inline(clean)+'</div>';
  });

  return '<div class="wsec '+tagcls+'">'
       + '<div class="wsec-head">'
       + '<span class="wtag">'+esc(tag)+'</span>'
       + (title ? '<span class="wtitle">'+esc(title)+'</span>' : '')
       + '</div>'
       + (body ? '<div class="wcard">'+body+'</div>' : '')
       + '</div>';
}

function rowHtml(text, num){
  return '<div class="wrow">'
       + (num ? '<span class="wnum">'+esc(num)+'</span>' : '<span class="wdot"></span>')
       + '<span class="wtxt">'+inline(text)+'</span></div>';
}

/* ===========================================================================
   DÉCOUPAGE PAR JOUR + MOTEUR MARKDOWN (repli) — copié à l'identique
   d'index.html.
   =========================================================================== */
const DAYS = [
  ['MONDAY','LUNDI'],['TUESDAY','MARDI'],['WEDNESDAY','MERCREDI'],
  ['THURSDAY','JEUDI'],['FRIDAY','VENDREDI'],['SATURDAY','SAMEDI'],['SUNDAY','DIMANCHE']
];
const DAY_RE = new RegExp('\\b(' + [].concat.apply([], DAYS).join('|') + ')\\b', 'i');
const NOM_DATE_RE = /(\d{2})\/(\d{2})\/(\d{4})/;

function parseNomDate(s){
  const m = s.match(NOM_DATE_RE);
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}

function splitDays(text){
  const lines = (text || '').split(/\r?\n/);
  const cuts = [];
  lines.forEach((ln, i) => {
    const t = ln.trim();
    const isHeading = /^##\s+/.test(t);
    const isBoldLine = /^\*\*[^*]{1,40}\*\*:?\s*$/.test(t);
    if(!isHeading && !isBoldLine) return;
    const m = t.match(DAY_RE);
    if(m) cuts.push({ i:i, label:normDay(m[1]), date:parseNomDate(t) });
  });
  if(cuts.length < 1) return [{ label:'Tout', body:text || '', date:null }];

  const days = cuts.map((c, k) => ({
    label: c.label,
    date:  c.date,
    body:  lines.slice(c.i, k+1 < cuts.length ? cuts[k+1].i : lines.length).join('\n')
  }));
  return days
    .map((d, i) => ({ d, i }))
    .sort((a, b) => {
      if(a.d.date && b.d.date) return a.d.date - b.d.date;
      if(a.d.date) return -1;
      if(b.d.date) return 1;
      return a.i - b.i;
    })
    .map(x => x.d);
}

function normDay(w){ return w.toUpperCase(); }

/** Retire la syntaxe markdown des liens/images, garde juste le texte visible
 *  — utilisé pour juger la longueur réelle d'une ligne (voir renderWodBlock). */
function stripLinks(s){
  return s.replace(/!\[([^\]]*)\]\([^)\s]+\)/g, '$1').replace(/\[([^\]]+)\]\([^)\s]+\)/g, '$1');
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function inline(s){
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, (_,c)=>'<code>'+c+'</code>');
  // Pas de liens hypertexte sur l'écran TV (demande de Ron, 2026-08-25) :
  // personne ne peut cliquer dessus depuis le canapé, et le style lien
  // (souligné, couleur différente) distrait sans raison — texte brut.
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '$1');
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '$1');
  t = t.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  t = t.replace(/(^|[^_\w])_([^_\n]+)_(?![\w_])/g, '$1<em>$2</em>');
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return t;
}

function md(src){
  const lines = String(src || '').replace(/\r\n?/g,'\n').split('\n');
  let out = '', i = 0;

  const isTableSep = s => /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(s) && s.includes('-');
  const cells = s => s.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c => inline(c.trim()));

  while(i < lines.length){
    const raw = lines[i], line = raw.trim();
    if(!line){ i++; continue; }

    if(/^```/.test(line)){
      const buf = []; i++;
      while(i < lines.length && !/^```/.test(lines[i].trim())) buf.push(lines[i++]);
      i++;
      out += '<pre><code>'+esc(buf.join('\n'))+'</code></pre>';
      continue;
    }

    if(/^(\*\s*){3,}$|^(-\s*){3,}$|^(_\s*){3,}$/.test(line)){ out += '<hr>'; i++; continue; }

    let m = line.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      const lvl = Math.min(m[1].length, 4);
      out += '<h'+lvl+'>'+inline(m[2].replace(/\s*#+\s*$/,''))+'</h'+lvl+'>';
      i++; continue;
    }

    if(line.includes('|') && i+1 < lines.length && isTableSep(lines[i+1])){
      const head = cells(line); i += 2;
      let body = '';
      while(i < lines.length && lines[i].includes('|') && lines[i].trim()){
        body += '<tr>' + cells(lines[i]).map(c => '<td>'+c+'</td>').join('') + '</tr>';
        i++;
      }
      out += '<div class="table-wrap"><table><thead><tr>'
           + head.map(c => '<th>'+c+'</th>').join('')
           + '</tr></thead><tbody>'+body+'</tbody></table></div>';
      continue;
    }

    if(/^>\s?/.test(line)){
      const buf = [];
      while(i < lines.length && /^\s*>\s?/.test(lines[i])){
        buf.push(lines[i].replace(/^\s*>\s?/,'')); i++;
      }
      out += '<blockquote>'+md(buf.join('\n'))+'</blockquote>';
      continue;
    }

    const bullet = /^(\s*)([-*+])\s+(.*)$/, numbered = /^(\s*)(\d+)[.)]\s+(.*)$/;
    if(bullet.test(raw) || numbered.test(raw)){
      const ordered = !bullet.test(raw);
      const re = ordered ? numbered : bullet;
      let html = '', openSub = false;
      const baseIndent = raw.match(re)[1].length;

      while(i < lines.length){
        const r = lines[i];
        const mm = r.match(bullet) || r.match(numbered);
        if(!mm){
          if(r.trim() && /^\s{2,}/.test(r) && html){ html = html.replace(/<\/li>$/, ' '+inline(r.trim())+'</li>'); i++; continue; }
          break;
        }
        const ind = mm[1].length, txt = mm[3];
        if(ind > baseIndent){
          if(!openSub){ html += '<ul>'; openSub = true; }
          html += '<li>'+inline(txt)+'</li>';
        }else{
          if(openSub){ html += '</ul>'; openSub = false; }
          html += '<li>'+inline(txt)+'</li>';
        }
        i++;
      }
      if(openSub) html += '</ul>';
      out += ordered ? '<ol>'+html+'</ol>' : '<ul>'+html+'</ul>';
      continue;
    }

    const buf = [];
    while(i < lines.length && lines[i].trim()
          && !/^(#{1,6}\s|>|```)/.test(lines[i].trim())
          && !bullet.test(lines[i]) && !numbered.test(lines[i])){
      buf.push(lines[i].trim()); i++;
    }
    if(buf.length) out += '<p>'+inline(buf.join(' '))+'</p>';
  }
  return out;
}

/* ===========================================================================
   VÉRIFICATION DE VERSION
   Compare la version en cours d'exécution à celle publiée en ligne et recharge
   si elle a changé. On ne demande que les 2 premiers Ko du fichier (le meta
   "build" est en tête de <head>) : inutile de retélécharger toute la page.
   =========================================================================== */
const BUILD = '20260902-1442';

async function checkVersion(){
  try{
    const r = await fetch(location.pathname + '?cb=' + Date.now(), {
      cache: 'no-store',
      headers: { 'Range': 'bytes=0-2047' }
    });
    if(!r.ok && r.status !== 206) return;
    const m = (await r.text()).match(/name="build" content="([^"]+)"/);
    if(!m || m[1] === BUILD) return;
    // Garde-fou : une seule tentative de rechargement par version. Si le cache
    // résiste malgré tout, on reste sur la version en place plutôt que de
    // recharger en boucle.
    const cle = 'eb_maj_' + m[1];
    try{
      if(sessionStorage.getItem(cle)) return;
      sessionStorage.setItem(cle, '1');
    }catch(_){}
    location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
  }catch(_){ /* réseau indisponible : on garde la version en place */ }
}

/** Ligne de diagnostic en bas de l'écran : version + géométrie réelle.
 *  La géométrie est là parce qu'un écran de salle ne peut rien raconter :
 *  quand la mise en page est cassée (carte de connexion coincée en haut à
 *  gauche, séance qui ne s'affiche pas), la question est toujours « quelle
 *  hauteur le navigateur croit-il avoir ? ». `100dvh` est mal calculé sur
 *  certains boîtiers TV, et tout en dépend. Affiché ici, une simple photo
 *  répond à la question. `dvh` est mesuré, pas supposé : on lit la hauteur
 *  qu'un élément en 100dvh obtient réellement. */
/** Bandeau de diagnostic sous la carte de connexion. Il n'apparaît QUE quand
 *  le formulaire est visible : à ce moment-là il n'y a rien d'autre à
 *  regarder, et c'est exactement le moment où l'on a besoin de savoir
 *  pourquoi la connexion automatique n'a pas eu lieu.
 *  La clé n'est jamais affichée — seulement sa présence et sa longueur : une
 *  photo de l'écran ne doit pas divulguer le secret. */
function afficheDiagnosticConnexion(){
  try{
    const p = new URLSearchParams(location.search).get('k');
    const h = new URLSearchParams(location.hash.replace(/^#/, '')).get('k');
    const cle = p || h;
    const etat = cle
      ? 'clé détectée (' + cle.length + ' caractères, dans ' + (p ? "l'adresse" : 'le fragment') + ')'
      : '⚠ AUCUNE CLÉ DANS L\'ADRESSE';
    $('#login').insertAdjacentHTML('beforeend',
      '<div style="margin-top:18px;text-align:center;font:600 22px/1.5 system-ui,-apple-system,sans-serif;'
      + 'color:#8ea0bd;max-width:900px">'
      + 'v' + BUILD + ' · ' + innerWidth + '×' + innerHeight + '<br>' + etat + '</div>');
  }catch(_){}
}

function afficheVersion(){
  try{
    const sonde = document.createElement('div');
    sonde.style.cssText = 'position:absolute;top:-9999px;height:100dvh';
    document.body.appendChild(sonde);
    const dvh = sonde.clientHeight;
    sonde.remove();
    const geo = innerWidth + '×' + innerHeight + ' · dvh ' + dvh
              + (dvh && Math.abs(dvh - innerHeight) <= 2 ? '' : ' ⚠');
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;right:8px;bottom:6px;z-index:9999;pointer-events:none;'
      + 'font:400 10px/1 system-ui,-apple-system,sans-serif;color:#8ea0bd;opacity:.45">v'
      + BUILD + ' · ' + geo + '</div>');
  }catch(_){}
}
afficheVersion();
checkVersion();
setInterval(checkVersion, 30 * 60 * 1000);

/* ===========================================================================
   DÉMARRAGE
   =========================================================================== */
/** Connexion par clé d'URL (2026-08-30, demande de Ron) : l'écran ouvre
 *  `tv.html?k=<clé>` et démarre seul, sans rien à taper. La clé n'est PAS
 *  dans ce fichier (public sur GitHub Pages) : elle est dans le favori du
 *  boîtier et validée côté serveur.
 *
 *  Ordre volontaire : une session déjà en place l'emporte sur la clé — inutile
 *  de rejouer une connexion réseau à chaque démarrage, et l'écran continue de
 *  fonctionner si le serveur est momentanément injoignable.
 *
 *  La clé est retirée de la barre d'adresse dès qu'elle a servi : elle ne
 *  traîne pas à l'écran ni dans une capture, et le rechargement automatique de
 *  version (checkVersion) repart de toute façon sur une URL propre. */
async function demarrer(){
  if(restore()){ startTV(); return; }

  // On accepte la clé dans la chaîne de requête (?k=) ET dans le fragment
  // (#k=) : certains navigateurs de boîtiers d'affichage suppriment la
  // première. Le fragment n'est jamais envoyé au serveur, donc c'est aussi
  // la forme la plus discrète des deux.
  const cle = new URLSearchParams(location.search).get('k')
           || new URLSearchParams(location.hash.replace(/^#/, '')).get('k');
  if(!cle){ afficheDiagnosticConnexion(); return; }   // pas de clé : formulaire

  $('#tv').classList.remove('hide');
  $('#tv').innerHTML = '<div class="tv-screen"><div class="spin" style="margin:auto"></div></div>';
  try{
    const res = await api({ action:'tvKey', key:cle });
    if(!res.ok) throw new Error(res.error || 'Clé refusée');
    S.token = res.token; S.user = res.user;
    try{ localStorage.setItem('eb_tv', JSON.stringify({t:res.token,u:res.user})); }catch(_){}
    history.replaceState(null, '', location.pathname);
    startTV();
  }catch(err){
    // On retombe sur le formulaire plutôt que de laisser un écran mort.
    $('#tv').classList.add('hide');
    $('#login').classList.remove('hide');
    const msg = $('#loginMsg');
    msg.textContent = 'Connexion par clé impossible : ' + err.message;
    msg.classList.remove('hide');
    afficheDiagnosticConnexion();
  }
}
demarrer();
</script>
